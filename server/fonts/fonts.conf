<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Used by sharp/librsvg when rendering the SVG placeholder flyers to JPEG for WhatsApp previews:
     the server image may have no Hebrew fonts, so the bundled Culmus "Simple CLM" (GPL + font exception) is added. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
