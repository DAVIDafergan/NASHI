<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>האזור האישי שלי · GiveIL</title>
<link rel="icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1917;--paper:#f6f5f3;--card:#fff;--mut:#6b6762;--line:#e9e6e2;--soft:#f5f4f1;--p:#5b3df5;--ok:#0f9d6e;--wa:#25D366;--grad:linear-gradient(120deg,#7c5cff,#22d3ee 55%,#a3ff6f);--f:"Rubik",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f);-webkit-font-smoothing:antialiased}
a{color:inherit}.w{max-width:560px;margin:0 auto;padding:0 16px 40px}
.hero{position:relative;height:190px;background:#1c1917 center/cover;border-radius:0 0 26px 26px;overflow:hidden;margin:0 -16px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.72))}
.hero .t{position:absolute;inset-inline:20px;bottom:46px;z-index:1;color:#fff}.hero small{opacity:.85;font-size:13px}.hero h1{margin:2px 0 0;font-size:22px;line-height:1.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 1px 3px rgba(28,25,23,.05)}
.me{margin-top:-34px;position:relative;z-index:2;box-shadow:0 20px 50px -24px rgba(28,25,23,.35)}
.hi{font-size:14px;color:var(--mut)}.hi b{color:var(--ink);font-size:20px;display:block}
.big{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:12px}.big .v{font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}.big .v small{font-size:15px;font-weight:500;color:var(--mut);letter-spacing:0}
.rank{background:#f5f3ff;color:var(--p);border-radius:14px;padding:8px 12px;text-align:center;font-weight:700;font-size:13px;line-height:1.2}.rank b{display:block;font-size:22px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .8s}
.goal{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px}
h2{font-size:17px;margin:0 0 10px}
.link{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;direction:ltr}.link span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:14px;font:700 16px var(--f);cursor:pointer;text-decoration:none;margin-top:10px;background:var(--ink);color:#fff}
.btn.wa{background:var(--wa);color:#073b1d}.btn.o{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.s{width:auto;padding:8px 12px;font-size:14px;margin:0}
textarea,input{width:100%;font:15px var(--f);border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;color:var(--ink)}textarea{min-height:120px;resize:vertical;line-height:1.5}
label{display:block;font-size:13px;color:var(--mut);margin-top:10px}
.d{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.d:last-child{border:0}.d small{display:block;color:var(--mut);font-size:12px}.d .a{font-weight:700;white-space:nowrap}
.top .d.me2{background:#f5f3ff;border-radius:10px;padding:10px;border:0;margin:2px 0}
.tip{font-size:14px;line-height:1.55;background:linear-gradient(120deg,rgba(124,92,255,.08),rgba(34,211,238,.08));border:1px solid rgba(124,92,255,.18);border-radius:14px;padding:12px 14px;margin-top:12px}
.empty{color:var(--mut);font-size:14px;text-align:center;padding:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:24px}.foot b{font-weight:800}.foot b i{font-style:normal;color:#3b82f6}
.ended{background:#1c1917;color:#fff;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.join{text-align:center}.join .emo{font-size:46px}.join h1{font-size:24px;margin:6px 0}.join p{color:var(--mut);margin:0 0 6px}
.steps{display:grid;gap:8px;text-align:start;margin:14px 0 4px}.steps div{display:flex;gap:10px;align-items:flex-start;font-size:14px}.steps i{font-style:normal;flex:0 0 26px;height:26px;border-radius:50%;background:#f5f3ff;color:var(--p);display:grid;place-items:center;font-weight:800;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.kpi{background:var(--soft);border-radius:14px;padding:12px 10px;text-align:center}.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.1}.kpi span{font-size:12px;color:var(--mut)}.kpi.hl{background:#f5f3ff;color:var(--p)}.kpi.hl span{color:var(--p)}
.grid{display:grid;gap:0}.col{min-width:0}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.w{max-width:1120px;padding:0 32px 56px}.hero{height:280px;margin:0 calc(50% - 50vw);border-radius:0}.hero .t{inset-inline:max(40px,calc(50vw - 528px));bottom:80px}.hero h1{font-size:32px}.hero small{font-size:15px}
 .me{margin-top:-46px;padding:26px 30px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:8px 40px;align-items:center}.me .kpis{margin-top:0}.me .full{grid-column:1/-1}
 .big .v{font-size:52px}.grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:6px}.card{padding:22px 24px;margin-top:20px}}
.toast:not(.on){visibility:hidden;transition:.3s,visibility 0s .3s}
</style>
</head>
<body>
<div class="w" id="app"><div class="empty" style="padding-top:80px">טוען…</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e.t);e.t=setTimeout(()=>e.classList.remove('on'),2200)};
const parts=location.pathname.split('/');const MODE=parts[1],ID=parts[2];let D,cur='₪';
const f=n=>cur+Math.round(+n||0).toLocaleString('he-IL');
const ago=s=>{if(!s)return'';const m=Math.round((Date.now()-new Date(s.replace(' ','T')+'Z'))/6e4);return m<1?'עכשיו':m<60?`לפני ${m} דק׳`:m<1440?`לפני ${Math.round(m/60)} שע׳`:`לפני ${Math.round(m/1440)} ימים`};
const msgFor=()=>`היי! 👋\nאני משתתף/ת בגיוס ל${D.campaign.title}${D.team.goal?` והצבתי לעצמי יעד של ${f(D.team.goal)}`:''}.\nכל תרומה, גם קטנה, עוזרת – ואם תתרמו דרך הקישור שלי היא תיספר לזכותי 💙\n${D.link}`;
async function join(){
  const j=await fetch('/api/j/'+ID).then(r=>r.ok?r.json():null);
  if(!j){$('#app').innerHTML='<div class="card join" style="margin-top:60px"><div class="emo">🤔</div><h1>הקישור לא נמצא</h1></div>';return}
  $('#app').innerHTML=`<div class="hero" style="${j.cover?`background-image:url('${esc(j.cover).replace(/[()]/g,'')}')`:''}"><div class="t"><small>מערך השגרירים</small><h1>${esc(j.title)}</h1></div></div>
  <div class="card me join">${j.open?`<div class="emo">🙌</div><h1>תודה על התרומה!</h1><p>רוצים לעזור לנו להגיע ליעד? הצטרפו לשגרירים.</p>
   <div class="steps"><div><i>1</i>מקבלים קישור אישי לשיתוף</div><div><i>2</i>שולחים לחברים, למשפחה ולקבוצות</div><div><i>3</i>כל תרומה דרככם נספרת לזכותכם, ואתם מקבלים עדכון</div></div>
   <label>השם שיופיע בדף השגרירים<input id="jn" value="${esc(j.name||'')}"></label><label>יעד אישי (לא חובה)<input id="jg" type="number" inputmode="numeric" placeholder="למשל 1800"></label>
   <button class="btn" id="jgo">אני רוצה להיות שגריר/ה</button>`:`<div class="emo">💙</div><h1>תודה על התרומה!</h1><p>ההצטרפות לשגרירים בקמפיין הזה סגורה.</p><a class="btn o" href="/c/${esc(j.slug)}">לדף הקמפיין</a>`}</div>
  <div class="foot">מופעל ע״י <b dir="ltr">Give<i>IL</i></b></div>`;
  if(j.open)$('#jgo').onclick=async()=>{const b=$('#jgo');b.disabled=true;b.textContent='רגע…';const r=await fetch(`/api/d/${ID}/ambassador`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#jn').value,goal:$('#jg').value})}).then(x=>x.json()).catch(()=>({error:'שגיאה, נסו שוב'}));if(r.error){b.disabled=false;b.textContent='אני רוצה להיות שגריר/ה';return toast(r.error)}location.replace(r.area+'?new=1')}}
async function load(){
  const r=await fetch('/api/amb/'+ID);if(!r.ok){$('#app').innerHTML='<div class="card join" style="margin-top:60px"><div class="emo">🤔</div><h1>האזור האישי לא נמצא</h1><p>ייתכן שהקישור שגוי. בקשו ממנהלי הקמפיין לשלוח אותו שוב.</p></div>';return}
  D=await r.json();const c=D.campaign,t=D.team,m=D.me;cur=c.currency==='USD'?'$':'₪';document.title=`${t.name} · ${c.title}`;
  const pct=t.goal?Math.min(100,Math.round(m.raised/t.goal*100)):0;const isNew=location.search.includes('new=1');
  $('#app').innerHTML=`<div class="hero" style="${c.cover?`background-image:url('${esc(c.cover).replace(/[()]/g,'')}')`:''}"><div class="t"><small>האזור האישי של השגריר/ה</small><h1>${esc(c.title)}</h1></div></div>
  <div class="card me"><div><div class="hi">${isNew?'ברוכים הבאים 🙌':'שלום'}<b>${esc(t.name)}</b></div>
   <div class="big"><div class="v">${f(m.raised)}<br><small>גויסו דרככם</small></div></div></div>
   <div class="kpis"><div class="kpi"><b>${m.visits||0}</b><span>כניסות לקישור</span></div><div class="kpi"><b>${m.count}</b><span>תורמים</span></div><div class="kpi"><b>${m.visits&&m.visits>=m.count?Math.round(m.count/m.visits*100)+'%':'–'}</b><span>מהנכנסים תרמו</span></div><div class="kpi hl"><b>${m.of>1&&m.raised?m.rank:'–'}</b><span>${m.of>1?'מקום מתוך '+m.of:'מקום'}</span></div></div>
   <div class="full">${t.goal?`<div class="bar"><i style="width:${pct}%"></i></div><div class="goal"><span>${pct}% מהיעד האישי</span><span>יעד: ${f(t.goal)}</span></div>`:`<div class="tip">💡 הציבו יעד אישי – אנשים תורמים יותר כשהם רואים לאן מתקדמים. <a href="#edit">הצבת יעד ↓</a></div>`}
   ${c.ended?'<div class="ended">🏁 הקמפיין הסתיים. תודה על כל מה שעשיתם!</div>':''}${c.test?'<div class="tip">🧪 הקמפיין עדיין במצב בדיקה – התרומות כאן הן תרומות בדיקה.</div>':''}</div></div>
  <div class="grid"><div class="col">
  ${c.ended?'':`<div class="card"><h2>📣 הקישור האישי שלכם</h2><div class="link"><span>${esc(D.link)}</span><button class="btn s o" id="cp">העתקה</button></div>
   <label>הודעה מוכנה לשליחה (אפשר לערוך)</label><textarea id="msg">${esc(msgFor())}</textarea>
   <a class="btn wa" id="wa" target="_blank" rel="noopener">שליחה בוואטסאפ</a>${navigator.share?'<button class="btn o" id="sh">שיתוף בדרכים נוספות</button>':''}
   <div class="tip">💡 הכי עובד: הודעה אישית לכל אחד בנפרד, ואחר כך לקבוצות ולסטטוס. כשמישהו תורם דרככם – ${D.waAuto?'תקבלו על זה הודעה בוואטסאפ':'זה יופיע כאן'}.</div></div>`}
  <div class="card"><h2>💙 מי תרם דרככם (${m.count})</h2>${D.donors.length?D.donors.map(d=>`<div class="d"><div>${d.name?esc(d.name):'אנונימי/ת'}${d.dedication?`<small>${esc(d.dedication)}</small>`:''}<small>${ago(d.at)}</small></div><div class="a">${f(d.amount)}</div></div>`).join(''):'<div class="empty">עוד אין תרומות דרך הקישור שלכם. שלחו אותו לחמישה אנשים קרובים – זו ההתחלה הכי טובה.</div>'}</div>
  </div><div class="col">
  ${D.top.length>1?`<div class="card top"><h2>🏆 השגרירים המובילים</h2>${D.top.map((a,i)=>`<div class="d ${a.me?'me2':''}"><div>${i+1}. ${esc(a.name)}${a.me?' (אתם)':''}</div><div class="a">${f(a.s)}</div></div>`).join('')}</div>`:''}
  <div class="card" id="edit"><h2>✏️ הפרטים שלכם</h2><label>השם בדף השגרירים<input id="en" value="${esc(t.name)}"></label><label>יעד אישי<input id="eg" type="number" inputmode="numeric" value="${t.goal||''}" placeholder="למשל 1800"></label><label>משפט אישי (מופיע בדף שלכם)<input id="ed" value="${esc(t.descr||'')}" placeholder="למשל: עזרו לי להגיע ליעד לכבוד…"></label><button class="btn o" id="es">שמירה</button></div>
  <div class="card" style="text-align:center"><a href="/c/${esc(c.slug)}/${esc(t.slug)}" target="_blank" style="font-weight:600">לדף השגריר שלכם בקמפיין ↗</a><div class="hi" style="margin-top:6px">שמרו את הקישור לאזור האישי – הוא אישי רק לכם.</div></div>
  </div></div>
  <div class="foot">מופעל ע״י <b dir="ltr">Give<i>IL</i></b></div>`;
  if(!c.ended){const upd=()=>$('#wa').href='https://wa.me/?text='+encodeURIComponent($('#msg').value);$('#msg').oninput=upd;upd();
   $('#cp').onclick=()=>{navigator.clipboard.writeText(D.link);toast('הקישור הועתק')};if($('#sh'))$('#sh').onclick=()=>navigator.share({text:$('#msg').value}).catch(()=>{})}
  $('#es').onclick=async()=>{const r=await fetch('/api/amb/'+ID,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#en').value,goal:$('#eg').value,descr:$('#ed').value})}).then(x=>x.json());if(r.error)return toast(r.error);toast('נשמר ✓');const keep=$('#msg')?$('#msg').value:null;await load()};
}
if(MODE==='j')join();else{load();setInterval(()=>{if(!document.hidden&&!document.activeElement?.matches('textarea,input'))load()},45000)}
</script>
<script src="/a11y.js?v=5" defer></script>
</body>
</html>
