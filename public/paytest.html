<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>עמוד תשלום (בדיקה)</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>body{margin:0;font:400 16px/1.6 Heebo,sans-serif;background:#f6f8fc;color:#0f172a;min-height:100vh;display:grid;place-items:center;padding:20px}.c{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;width:min(440px,100%);box-shadow:0 20px 50px -30px rgba(15,23,42,.3)}.t{font-size:12px;font-weight:700;color:#b45309;background:#fef3c7;border-radius:99px;padding:4px 10px;display:inline-block}h1{font-size:22px;margin:12px 0 4px}.a{font-size:36px;font-weight:900;color:#2563eb;margin:10px 0}.f{display:grid;gap:10px;margin:16px 0}input{width:100%;box-sizing:border-box;border:1.5px solid #e5e7eb;border-radius:10px;padding:12px;font:inherit;direction:ltr}.b{width:100%;border:0;border-radius:12px;padding:14px;font:700 16px Heebo;cursor:pointer;color:#fff;background:#2563eb;margin-top:6px}.b.r{background:#fff;color:#dc2626;border:1.5px solid #fecaca}.m{color:#64748b;font-size:13px}</style></head>
<body><div class="c"><span class="t">סביבת בדיקה · לא מתבצע חיוב</span><h1 id="t">תשלום</h1><div class="m" id="n"></div><div class="a" id="a"></div>
<div class="f"><input placeholder="4580 0000 0000 0000" value="4580 1234 5678 9012"><div style="display:flex;gap:10px"><input placeholder="MM/YY" value="12/29"><input placeholder="CVV" value="123"></div></div>
<button class="b" id="ok">אישור תשלום (הצלחה)</button><button class="b r" id="fail">דימוי כישלון</button><p class="m">כך ייראה התהליך אצל ספק הסליקה האמיתי. בעלייה לאוויר העמוד הזה מוחלף בדף התשלום של הספק שבחרתם.</p></div>
<script>const tok=location.pathname.split('/').pop();fetch('/api/d/'+tok).then(r=>r.json()).then(d=>{document.getElementById('t').textContent=d.title;document.getElementById('n').textContent='תורם: '+d.name;document.getElementById('a').textContent=(d.currency==='USD'?'$':'₪')+d.amount.toLocaleString();});
const go=async(result)=>{await fetch('/pay/test/'+tok,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({result})});location.href='/pay/return/'+tok};
document.getElementById('ok').onclick=()=>go('ok');document.getElementById('fail').onclick=()=>go('fail');</script></body></html>
