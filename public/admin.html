<!DOCTYPE html>
<html lang="he" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול | רעננים</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/style.css">
<style>
body{background:var(--paper)}header{position:static}main{padding:24px 20px 80px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:22px 0;background:var(--paper2);padding:4px;border-radius:999px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;font:600 14px Sans;color:var(--ink2);padding:9px 16px;border-radius:999px;cursor:pointer}.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.25)}
.risk{display:inline-block;font-weight:800;font-size:13px;border-radius:99px;padding:3px 12px}
.flags{margin:8px 0;padding-right:18px;color:var(--ink2);font-size:14px}
.rc{display:grid;grid-template-columns:150px 1fr;gap:16px}.rc img{width:150px;height:190px;object-fit:cover;border-radius:12px;cursor:zoom-in;background:#000}
@media(max-width:600px){.rc{grid-template-columns:1fr}.rc img{width:100%;height:240px}}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{padding:10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{color:var(--mute);font-weight:600;font-size:13px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.inline input,.inline select{flex:1;min-width:130px;width:auto}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--mute)}.kpi b{font:900 26px Serif;display:block;color:var(--ink)}
.warn{background:var(--gold3);color:#5E4515;border-radius:14px;padding:14px 16px;margin-top:14px;font-size:15px}
.pr{display:flex;gap:14px;align-items:center}.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 14px}.rgrid .w2{grid-column:span 2}@media(max-width:800px){.rgrid{grid-template-columns:1fr}.rgrid .w2{grid-column:auto}}.pr .th{width:64px;height:48px;border-radius:8px;background:var(--paper2) center/cover;flex:none}
</style></head>
<body>
<header class="solid"><div class="bar"><a class="logo" href="/"><img src="/logo.svg" alt="" width="40" height="40"><span>רעננים</span></a><nav><a class="l" href="/">לאתר</a></nav></div></header>
<main class="wrap">
  <div id="login" class="me" style="max-width:380px;margin:40px auto">
    <h3 style="font-size:28px">כניסת מנהל</h3>
    <label>סיסמה</label><input type="password" id="pw">
    <button class="btn full" id="go">כניסה</button><div class="err" id="lerr"></div>
  </div>
  <div id="panel" class="hide">
    <div class="kpi" id="kpi"></div>
    <div class="tabs">
      <button class="btn small ghost on" data-t="pending">קבלות לאישור</button>
      <button class="btn small ghost" data-t="stores">עסקים</button>
      <button class="btn small ghost" data-t="raffles">פרסים והגרלות</button>
      <button class="btn small ghost" data-t="apps">בקשות הצטרפות</button>
      <button class="btn small ghost" data-t="sms">הגדרות SMS</button>
    </div>
    <div id="t-pending"></div>
    <div id="t-stores" class="hide">
      <div class="card"><b>הוספת עסק</b><div class="inline" style="margin-top:10px">
        <input id="s_name" placeholder="שם העסק"><input id="s_category" placeholder="תחום"><input id="s_address" placeholder="כתובת (לניווט)"><input id="s_phone" placeholder="טלפון העסק">
        <button class="btn small" id="addStore">הוספה</button></div></div>
      <div class="card"><table id="storesT"></table></div>
    </div>
    <div id="t-raffles" class="hide">
      <div class="card" id="rForm"><b id="rFormT" style="font-size:18px">פרס חדש</b><input type="hidden" id="r_id">
        <div class="rgrid">
          <div><label for="r_prize">שם הפרס</label><input id="r_prize" placeholder="למשל: טיסה זוגית לאירופה"></div>
          <div><label for="r_title">כותרת קטנה</label><input id="r_title" placeholder="למשל: הגרלת השבוע"></div>
          <div class="w2"><label for="r_blurb">תיאור קצר</label><input id="r_blurb" placeholder="משפט אחד שמופיע בכרטיס"></div>
          <div><label for="r_date">תאריך ההגרלה</label><input id="r_date" type="date"></div>
          <div><label for="r_kind">סוג</label><select id="r_kind"><option value="raffle">הגרלה</option><option value="top">פרס מובילים (לפי טבלה)</option></select></div>
          <div><label for="r_rank">מקום (לפרס מובילים)</label><input id="r_rank" type="number" min="1" placeholder="1"></div>
          <div><label for="r_value">שווי (פנימי, לא מוצג באתר)</label><input id="r_value"></div>
          <div class="w2"><label for="r_image">תמונה</label><div class="inline"><span id="r_prev" style="width:84px;height:60px;border-radius:10px;background:var(--paper2) center/cover;display:inline-block;flex:none"></span><input id="r_image" placeholder="קישור לתמונה, או העלאה מהמחשב"><label class="btn small ghost" style="margin:0;cursor:pointer">העלאת תמונה<input type="file" id="r_file" accept="image/*" class="hide"></label></div></div>
          <div class="w2"><label class="chk" style="margin:0"><input type="checkbox" id="r_grand"> הפרס הגדול (מוצג ראשון ובגדול, ועם ספירה לאחור)</label></div>
        </div>
        <div class="inline" style="margin-top:14px"><button class="btn" id="addRaffle">הוספה</button><button class="btn ghost hide" id="cancelEdit">ביטול עריכה</button></div>
        <div class="note">הפרסים שמופיעים עכשיו הם הצעה. אפשר לערוך, למחוק ולהוסיף כרצונך, והאתר מתעדכן מיד.</div></div>
      <div id="rafflesL"></div>
    </div>
    <div id="t-apps" class="hide"><div class="card"><table id="appsT"></table></div></div>
    <div id="t-sms" class="hide"><div class="card" style="max-width:620px">
      <b style="font-size:18px">ספק SMS</b><div class="note" style="margin-top:4px">כל עוד אין ספק, האתר עובד במצב הדגמה: קוד הכניסה מוצג על המסך במקום להישלח. מומלץ לחבר ספק לפני ההשקה.</div>
      <label>ספק</label><select id="sm_type"><option value="none">ללא (מצב הדגמה)</option><option value="inforu">InforU</option><option value="019">019 SMS</option><option value="twilio">Twilio</option></select>
      <div id="sm_il"><div class="two"><div><label>שם משתמש</label><input id="sm_user" autocomplete="off"></div><div><label>שם שולח (עד 11 תווים באנגלית)</label><input id="sm_sender" placeholder="Raananim" maxlength="11"></div></div></div>
      <div id="sm_tw" class="hide"><div class="two"><div><label>Account SID</label><input id="sm_sid" autocomplete="off"></div><div><label>מספר שולח</label><input id="sm_from" placeholder="+1..."></div></div></div>
      <label>API Token</label><input id="sm_token" type="password" autocomplete="new-password" placeholder="השאירו ריק כדי לא לשנות">
      <button class="btn full" id="sm_save">שמירה</button>
      <div class="inline" style="margin-top:18px"><input id="sm_test" inputmode="tel" placeholder="הטלפון שלך לבדיקה"><button class="btn small ghost" id="sm_testBtn">שליחת הודעת בדיקה</button></div>
      <div class="err" id="sm_err"></div>
    </div></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const post = (u, b) => fetch(u, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b || {}) }).then(async r => { const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; });
const v = id => $('#' + id).value;
async function load() {
  const r = await fetch('/api/admin/overview'); if (r.status === 401) return;
  const d = await r.json();
  $('#login').classList.add('hide'); $('#panel').classList.remove('hide');
  const paid = d.stores.filter(s => s.paid).length;
  $('#kpi').innerHTML = `<div><b>${d.pending.length}</b>קבלות ממתינות</div><div><b>${d.users}</b>משתתפים</div><div><b>${d.stores.length}</b>עסקים (${paid} שילמו)</div><div><b>${paid * 250} ₪</b>הכנסות מהצטרפות</div><div><b>${d.sms === 'none' ? 'הדגמה' : d.sms}</b>ספק SMS</div><div><b>${d.ai ? 'פעיל' : 'כבוי'}</b>בדיקת AI</div>` + (d.sms === 'none' ? '<div class="warn" style="grid-column:1/-1">שירות ה-SMS עדיין לא מחובר, וקוד הכניסה מוצג למשתמשים על המסך. אפשר לחבר ספק בלשונית "הגדרות SMS".</div>' : '');
  if (d.visits) $('#kpi').insertAdjacentHTML('afterbegin', `<div style="border-color:#b8860b"><b>${d.applications.filter(a => a.status === 'callback').length}</b>עסקים נרשמו וממתינים לקישור תשלום<br><small>בלשונית "בקשות הצטרפות"</small></div><div style="border-color:#2b4c7e"><b>${d.visits.biz.u}</b>עסקים נכנסו לדף ההרשמה<br><small>היום: ${d.visits.biz.t} · צפיות: ${d.visits.biz.v}</small></div><div style="border-color:#7a2f3b"><b>${d.visits.site.u}</b>לקוחות נכנסו לאתר<br><small>היום: ${d.visits.site.t} · צפיות: ${d.visits.site.v}</small></div>`);
  $('#kpi').insertAdjacentHTML('beforeend', `<div class="warn" style="grid-column:1/-1;background:#EEF2F8"><b>מונה "עסקים כבר בפנים" בדף העסקים:</b> <input id="bizShownIn" type="number" min="0" value="${d.bizShown}" style="width:80px;padding:6px 8px;border:1px solid var(--line);border-radius:8px"> <button class="btn small" onclick="bizShownSave()">שמירה</button> <small>(0 מסתיר את המונה)</small></div>`);
  $('#kpi').insertAdjacentHTML('beforeend', `<div class="warn" style="grid-column:1/-1;background:${d.siteOpen ? '#DFF1E6' : 'var(--gold3)'}"><b>האתר הכללי: ${d.siteOpen ? 'פתוח לציבור' : 'סגור (מוצג "בקרוב")'}</b> · <button class="btn small ghost" onclick="siteToggle(${!d.siteOpen})">${d.siteOpen ? 'לסגור' : 'לפתוח לציבור'}</button><br><small>קישור תצוגה מקדימה (רק למי שתשלח): <code style="direction:ltr;display:inline-block">${d.previewUrl}</code> · דף העסקים פתוח תמיד</small></div>`);
  const c = d.smsCfg; $('#sm_type').value = c.type; $('#sm_user').value = c.user; $('#sm_sender').value = c.sender; $('#sm_sid').value = c.sid; $('#sm_from').value = c.from; $('#sm_token').placeholder = c.hasToken ? 'שמור. השאירו ריק כדי לא לשנות' : 'הדביקו כאן את הטוקן'; smToggle();
  $('#t-pending').innerHTML = d.pending.length ? d.pending.map(p => `<div class="card rc">
    <img src="/api/admin/image/${p.image}" onclick="open(this.src)">
    <div><span class="risk" style="background:${p.risk >= 50 ? '#F6E3DE' : p.risk >= 20 ? 'var(--gold3)' : '#E3F0E8'}">סיכון ${p.risk}</span>
    <b style="font-size:18px"> ${p.store}</b> · ${p.amount} ₪ · קבלה ${p.receipt_no}<br>${p.uname || ''}${p.uage ? ' (' + p.uage + ')' : ''} ${p.phone} · ${p.receipt_date}${p.rejected_before ? ` · <b style="color:#d5321a">${p.rejected_before} קבלות נדחו בעבר</b>` : ''}
    <ul class="flags">${(JSON.parse(p.flags || '[]')).map(f => `<li>${f}</li>`).join('')}</ul>
    ${p.ai ? (a => `<div class="note">AI קרא בקבלה: ${a.business_name || '?'} · ${a.total ?? '?'} ₪ · ${a.date || '?'} · מס׳ ${a.receipt_number || '?'}</div>`)(JSON.parse(p.ai)) : ''}
    <div class="inline" style="margin-top:10px"><input id="a${p.id}" type="number" value="${p.amount}" style="max-width:130px"> ₪
    <button class="btn small" onclick="act(${p.id},'approve')">אישור</button>
    <input id="n${p.id}" placeholder="סיבת דחייה"><button class="btn small ghost" onclick="act(${p.id},'reject')">דחייה</button><button class="btn small ghost" onclick="ban(${p.uid})">חסימת משתמש</button></div></div></div>`).join('')
    : '<div class="card">אין קבלות שממתינות.</div>';
  $('#storesT').innerHTML = '<tr><th>עסק</th><th>קבלות</th><th>לקוחות</th><th>סכום שהגיע</th><th>שילם</th><th>פעיל</th><th></th></tr>' + d.stores.map(s => `<tr>
    <td>${s.name}<br><small style="color:var(--mute)">${s.category}</small></td><td>${s.receipts}</td><td>${s.customers}</td><td>${Math.round(s.revenue).toLocaleString()} ₪</td>
    <td><button class="btn small ghost" onclick="tog(${s.id},'paid')">${s.paid ? 'שילם' : 'לא'}</button></td>
    <td><button class="btn small ghost" onclick="tog(${s.id},'active')">${s.active ? 'פעיל' : 'כבוי'}</button></td>
    <td>${s.receipts ? '' : `<button class="btn small ghost" onclick="del(${s.id})">מחיקה</button>`}</td></tr>`).join('');
  $('#rafflesL').innerHTML = d.raffles.map(r => `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <div class="pr"><div class="th" style="background-image:url('${r.image || ''}')"></div><div><b>${r.prize}</b> · ${r.title} · ${r.draw_date}${r.value ? ' · ' + r.value : ''}${r.is_grand ? ' · <b style="color:var(--gold)">פרס ראשי</b>' : ''}${r.kind === 'top' ? ' · <b style="color:var(--wine)">פרס מובילים, מקום ' + r.rank + '</b>' : ''}
    ${r.winner_user_id ? `<br>זוכה: ${r.wname || ''} ${r.wphone}` : ''}</div></div>
    ${r.winner_user_id ? '' : `<div class="inline"><button class="btn small" onclick="draw(${r.id})">${r.kind === 'top' ? 'הענקה למוביל' : 'ביצוע הגרלה'}</button><button class="btn small ghost" onclick="editR(${r.id})">עריכה</button><button class="btn small ghost" onclick="delR(${r.id})">מחיקה</button></div>`}</div>`).join('');
  RAFFLES = d.raffles;
  $('#appsT').innerHTML = `<tr><td colspan="7"><div class="inline">תשלום עסקים (SUMIT דרך GiveIL): <b>${d.pay ? 'מחובר' : 'לא מחובר'}</b> · מחיר: ${d.bizPrice} ₪ <button class="btn small ghost" onclick="payTest()">בדיקת חיבור</button><span id="payMsg"></span></div></td></tr>` +
    '<tr><th>עסק</th><th>תחום</th><th>איש קשר</th><th>טלפון</th><th>סטטוס</th><th>הערות</th><th>תאריך</th></tr>' + d.applications.map(a =>
    `<tr><td>${a.logo ? `<img src="${a.logo}" alt="" style="width:44px;height:44px;object-fit:contain;border-radius:8px;background:#fff;border:1px solid var(--line);float:right;margin-left:8px">` : ''}${a.business}${a.company_no ? '<br><small>' + a.company_no + '</small>' : ''}</td><td>${a.category}${a.address ? '<br><small>' + a.address + '</small>' : ''}</td><td>${a.contact}${a.email ? '<br><small>' + a.email + '</small>' : ''}</td><td><a href="https://wa.me/972${a.phone.slice(1)}">${a.phone}</a></td><td>${{ paid: '<b style="color:var(--ok)">שילם</b>', pending_payment: 'לא השלים תשלום', callback: '<b style="color:var(--wine)">ממתין לקישור תשלום</b>', link_sent: 'נשלח קישור', new: 'חדש' }[a.status] || a.status}${a.status !== 'paid' && a.status !== 'new' ? `<br><button class="btn small" onclick="payLink(${a.id})">קישור תשלום</button>` : ''}</td><td>${a.notes}</td><td>${a.created_at.slice(0, 10)}</td></tr>`).join('');
}
async function act(id, action) { await post('/api/admin/receipts/' + id, { action, amount: v('a' + id), note: v('n' + id) }); load(); }
async function ban(id) { if (confirm('לחסום את המשתמש? כל הקבלות והכרטיסים שלו יבוטלו.')) { await post(`/api/admin/users/${id}/ban`); load(); } }
async function tog(id, field) { await post('/api/admin/stores/' + id, { field }); load(); }
async function del(id) { if (confirm('למחוק את העסק?')) { await post('/api/admin/stores/' + id, { delete: 1 }); load(); } }
async function delR(id) { if (confirm('למחוק את ההגרלה?')) { await post(`/api/admin/raffles/${id}/delete`); load(); } }
async function draw(id) {
  if (!confirm('לבצע את ההגרלה עכשיו? אי אפשר לבטל, והזוכה יקבל SMS.')) return;
  try { const r = await post(`/api/admin/raffles/${id}/draw`); alert(`הזוכה: ${r.winner.name || ''} ${r.winner.phone}\n${r.winner.tickets} כרטיסים מתוך ${r.winner.total}`); load(); }
  catch (e) { alert(e.message); }
}
$('#addStore').onclick = async () => { try { await post('/api/admin/stores', { name: v('s_name'), category: v('s_category'), address: v('s_address'), phone: v('s_phone') }); load(); } catch (e) { alert(e.message); } };
let RAFFLES = [];
const rFields = ['kind', 'rank', 'title', 'prize', 'blurb', 'value', 'image'];
function editR(id) {
  const r = RAFFLES.find(x => x.id === id); if (!r) return;
  $('#r_id').value = r.id; rFields.forEach(k => $('#r_' + k).value = r[k] ?? (k === 'kind' ? 'raffle' : ''));
  $('#r_date').value = r.draw_date; $('#r_grand').checked = !!r.is_grand; $('#r_prev').style.backgroundImage = r.image ? `url('${r.image}')` : '';
  $('#rFormT').textContent = 'עריכת פרס: ' + r.prize; $('#addRaffle').textContent = 'שמירת שינויים'; $('#cancelEdit').classList.remove('hide');
  $('#rForm').scrollIntoView({ behavior: 'smooth' });
}
function resetR() { $('#r_id').value = ''; rFields.forEach(k => $('#r_' + k).value = k === 'kind' ? 'raffle' : ''); $('#r_date').value = ''; $('#r_grand').checked = false; $('#r_prev').style.backgroundImage = ''; $('#rFormT').textContent = 'פרס חדש'; $('#addRaffle').textContent = 'הוספה'; $('#cancelEdit').classList.add('hide'); }
$('#cancelEdit').onclick = resetR;
$('#r_image').oninput = () => $('#r_prev').style.backgroundImage = v('r_image') ? `url('${v('r_image')}')` : '';
$('#r_file').onchange = async () => { const f = $('#r_file').files[0]; if (!f) return; const fd = new FormData(); fd.append('image', f);
  const r = await fetch('/api/admin/upload', { method: 'POST', body: fd }); const j = await r.json(); if (!r.ok) return alert(j.error);
  $('#r_image').value = j.url; $('#r_prev').style.backgroundImage = `url('${j.url}')`; $('#r_file').value = ''; };
$('#addRaffle').onclick = async () => { const id = v('r_id'); try { await post(id ? '/api/admin/raffles/' + id : '/api/admin/raffles', { kind: v('r_kind'), rank: v('r_rank'), title: v('r_title'), prize: v('r_prize'), blurb: v('r_blurb'), value: v('r_value'), image: v('r_image'), draw_date: v('r_date'), is_grand: $('#r_grand').checked }); resetR(); load(); } catch (e) { alert(e.message); } };
document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-t]').forEach(x => x.classList.toggle('on', x === b));
  ['pending', 'stores', 'raffles', 'apps', 'sms'].forEach(t => $('#t-' + t).classList.toggle('hide', t !== b.dataset.t));
});
async function bizShownSave() { await post('/api/admin/biz-shown', { n: $('#bizShownIn').value }); load(); }
async function siteToggle(open) { if (open && !confirm('לפתוח את האתר הכללי לכל הציבור?')) return; await post('/api/admin/site', { open }); load(); }
async function payLink(id) { try { const r = await post(`/api/admin/applications/${id}/paylink`); const w = window.open(r.wa, '_blank'); if (!w) prompt('העתיקו את קישור התשלום ושלחו לעסק:', r.url); load(); } catch (e) { alert(e.message); } }
async function payTest() { $('#payMsg').textContent = ' בודק…'; const r = await post('/api/admin/pay/test'); $('#payMsg').textContent = r.ok ? ' SUMIT מחובר ותקין' : ' ' + (r.msg || 'לא מחובר'); }
function smToggle() { const t = $('#sm_type').value; $('#sm_il').classList.toggle('hide', !['inforu', '019'].includes(t)); $('#sm_tw').classList.toggle('hide', t !== 'twilio'); }
$('#sm_type').onchange = smToggle;
$('#sm_save').onclick = async () => { $('#sm_err').textContent = ''; try { await post('/api/admin/sms', { type: v('sm_type'), user: v('sm_user'), sender: v('sm_sender'), sid: v('sm_sid'), from: v('sm_from'), token: v('sm_token') }); $('#sm_token').value = ''; $('#sm_err').style.color = 'var(--ok)'; $('#sm_err').textContent = 'נשמר'; load(); } catch (e) { $('#sm_err').style.color = ''; $('#sm_err').textContent = e.message; } };
$('#sm_testBtn').onclick = async () => { $('#sm_err').textContent = ''; try { await post('/api/admin/sms/test', { phone: v('sm_test') }); $('#sm_err').style.color = 'var(--ok)'; $('#sm_err').textContent = 'נשלח. בדקו את הטלפון.'; } catch (e) { $('#sm_err').style.color = ''; $('#sm_err').textContent = e.message; } };
$('#go').onclick = async () => { try { await post('/api/admin/login', { password: v('pw') }); load(); } catch (e) { $('#lerr').textContent = e.message; } };
$('#pw').onkeydown = e => e.key === 'Enter' && $('#go').click();
load();
</script>
</body></html>
