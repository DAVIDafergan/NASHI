<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול · רבינו שלי</title><meta name="robots" content="noindex"><meta name="theme-color" content="#060a1c">
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/base.css?v=6">
<style>
body{font-size:15px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(380px,100%);display:grid;gap:14px;text-align:center}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:#050817;border-inline-end:1px solid var(--line2);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
aside .logo{font-size:20px;margin:0 6px 22px}aside .logo img{width:32px;height:32px}
aside a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;color:var(--mut);font-weight:600}aside a:hover{background:rgba(255,255,255,.04);color:var(--ink)}aside a.on{background:rgba(217,174,91,.12);color:var(--gold2)}
aside a .b{margin-inline-start:auto;background:var(--gold);color:#1a1205;border-radius:99px;font-size:11px;padding:1px 8px;font-weight:800}
main{padding:26px clamp(16px,3vw,34px) 60px;min-width:0}
.h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.h h1{font-family:var(--fs);font-weight:900;font-size:32px}.h .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border:1px solid var(--line2);border-radius:18px;padding:16px 18px;background:rgba(255,255,255,.02)}.kpi span{color:var(--mut);font-size:13px;font-weight:600}.kpi b{display:block;font-family:var(--fs);font-weight:900;font-size:32px;line-height:1.15;margin-top:4px}.kpi small{color:var(--mut2);font-size:12px}
.kpi.hl{border-color:var(--line);background:linear-gradient(160deg,rgba(217,174,91,.12),transparent)}
.goal{margin-top:12px;border:1px solid var(--line);border-radius:18px;padding:18px}.goal .bar{height:12px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:10px}.goal .bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width 1.5s}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.card h3{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
#amap{height:520px;border-radius:16px;overflow:hidden;background:#05070f}
.leaflet-container{background:#05070f;font-family:var(--fb)}.leaflet-control-attribution{background:rgba(6,10,28,.7)!important;color:#777!important;font-size:10px!important}
.leaflet-tooltip.gt2{background:#0c1330;color:var(--ink);border:1px solid var(--line);border-radius:10px;font-weight:700}.leaflet-tooltip.gt2::before{display:none}
.bars{display:grid;gap:9px}.br{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;font-size:13px}.br .t{height:10px;border-radius:9px;background:rgba(255,255,255,.06);overflow:hidden}.br .t i{display:block;height:100%;background:var(--g);border-radius:9px}.br b{text-align:end}
.spark{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px}.spark i{flex:1;background:var(--g);border-radius:4px 4px 0 0;min-height:2px;position:relative;opacity:.85}.spark i:hover{opacity:1}.spark i:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#f6efe0;color:#111;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;margin-bottom:4px}
.tblw{overflow:auto;border:1px solid var(--line2);border-radius:16px}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:start;font-size:12px;color:var(--mut);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line2);background:rgba(255,255,255,.02);position:sticky;top:0;white-space:nowrap}td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}tr:hover td{background:rgba(255,255,255,.02)}
td small{color:var(--mut2);display:block}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.fl input,.fl select{width:auto;min-width:130px;padding:10px 12px;font-size:14px}
select.s,input.s{padding:7px 10px;font-size:13px;border-radius:10px;width:auto}
.st{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap}.st.new{background:rgba(255,138,122,.15);color:#ffb2a6}.st.assigned{background:rgba(120,170,255,.15);color:#a9c6ff}.st.out{background:rgba(217,174,91,.15);color:var(--gold2)}.st.delivered{background:rgba(125,220,154,.15);color:var(--ok)}.st.cancelled{background:rgba(255,255,255,.06);color:var(--mut2)}
.bulk{position:sticky;bottom:12px;margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#111a45;border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:0 20px 40px -10px #000}
.grid{display:grid;gap:14px;max-width:640px}
.mb{display:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:fixed;inset:0 0 auto 0;height:auto;flex-direction:row;overflow:auto;z-index:20;padding:8px;gap:2px}aside .logo{display:none}aside a{white-space:nowrap;padding:9px 11px;font-size:14px}main{padding-top:70px}}
</style>
</head>
<body>
<div class="login" id="login" hidden><form class="card" id="lf"><img src="/logo-420.png" alt="רבינו שלי" style="width:170px;margin:0 auto"><h1 class="serif" style="font-size:28px">ניהול רבינו שלי</h1><input type="password" id="pw" placeholder="סיסמת ניהול" autocomplete="current-password"><div class="err" id="lErr"></div><button class="btn">כניסה</button></form></div>
<div class="shell" id="shell" hidden>
  <aside><a class="logo" href="/" target="_blank"><img class="lgo" src="/logo-420.png" alt="רבינו שלי"></a>
    <a href="#ov" data-t="ov">📊 סקירה</a><a href="#boxes" data-t="boxes">📦 קופות ומשלוחים <span class="b" id="bNew" hidden></span></a><a href="#cities" data-t="cities">🗺 ערים ואזורים</a><a href="#coll" data-t="coll">💰 איסופים ותרומות <span class="b" id="bColl" hidden></span></a><a href="#rem" data-t="rem">🔔 תזכורות</a><a href="#set" data-t="set">⚙️ הגדרות</a>
    <a href="#" id="out" style="margin-top:auto">יציאה</a></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script src="/cities.js?v=5"></script><script src="/ilmap.js?v=5"></script>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const fmt=n=>Math.round(+n||0).toLocaleString('he-IL');const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)};
const api=async(u,o={})=>{const r=await fetch('/api'+u,{method:o.method||'GET',headers:o.body?{'Content-Type':'application/json'}:{},body:o.body?JSON.stringify(o.body):undefined});const j=await r.json().catch(()=>({}));if(r.status===401){showLogin();throw new Error('auth')}if(!r.ok){toast(j.error||'שגיאה');throw new Error(j.error)}return j};
const SL={new:'ממתין לקופה',assigned:'שובץ לשליח',out:'בדרך',delivered:'נמסרה',cancelled:'בוטל'};const CHL={sms:'SMS',whatsapp:'וואטסאפ',email:'מייל',call:'שיחה',none:'ללא'};
const dt=s=>s?new Date(s.includes('T')?s:s.replace(' ','T')+'Z').toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
function showLogin(){$('#login').hidden=false;$('#shell').hidden=true}
$('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/admin/login',{method:'POST',body:{password:$('#pw').value}});boot()}catch(x){$('#lErr').textContent=x.message}};
$('#out').onclick=async e=>{e.preventDefault();await api('/logout',{method:'POST'});location.reload()};
async function boot(){const {admin}=await api('/admin/me');if(!admin)return showLogin();$('#login').hidden=true;$('#shell').hidden=false;route()}
addEventListener('hashchange',route);
let O=null;
async function route(){const t=(location.hash||'#ov').slice(1);$$('aside a[data-t]').forEach(a=>a.classList.toggle('on',a.dataset.t===t));O=await api('/admin/overview');const nw=(O.status.find(x=>x.k==='new')||{}).n||0;$('#bNew').hidden=!nw;$('#bNew').textContent=nw;const oc=O.openPickups+O.totals.reportedN;$('#bColl').hidden=!oc;$('#bColl').textContent=oc;(P[t]||P.ov)()}
const bars=(rows,lab=r=>r.k,val=r=>r.n)=>{const mx=Math.max(1,...rows.map(val));return `<div class="bars">${rows.map(r=>`<div class="br"><span>${esc(lab(r))}</span><div class="t"><i style="width:${val(r)/mx*100}%"></i></div><b>${fmt(val(r))}</b></div>`).join('')||'<div style="color:var(--mut)">אין נתונים עדיין</div>'}</div>`};
const P={};
P.ov=()=>{const t=O.totals,s=O.stats,st=O.settings,pct=Math.min(100,s.boxes/st.goal*100),chk=s.boxes?Math.round(t.checkinsToday/s.boxes*100):0;
  const days=[];for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=d.toLocaleDateString('sv-SE');days.push({k,n:(O.daily.find(x=>x.d===k)||{}).n||0})}const mx=Math.max(1,...days.map(d=>d.n));
  $('#main').innerHTML=`<div class="h"><h1>סקירה</h1><span class="sp"></span><span style="color:var(--mut)">${new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}</span></div>
  <div class="kpis">
    <div class="kpi hl"><span>קופות פעילות</span><b class="gt">${fmt(s.boxes)}</b><small>+${fmt(t.todaySignups)} היום · +${fmt(t.weekSignups)} השבוע</small></div>
    <div class="kpi hl"><span>נכנס לקופות בכל בוקר</span><b class="gt">₪${fmt(s.daily)}</b><small>ממוצע ₪${t.avgAmount.toFixed(2)} לקופה</small></div>
    <div class="kpi hl"><span>צפי עד ראש השנה</span><b class="gt">₪${fmt(s.projected)}</b><small>${fmt(s.daysLeft)} ימים · עד ${new Date(st.targetDate).toLocaleDateString('he-IL')}</small></div>
    <div class="kpi hl"><span>כרטיסים לאומן (צפי)</span><b class="gt">${fmt(s.tickets)}</b><small>₪${fmt(st.ticketPrice)} לכרטיס</small></div>
    <div class="kpi"><span>כסף בקופות עכשיו (משוער)</span><b>₪${fmt(t.inBoxes)}</b><small>לפי ימים × התחייבות</small></div>
    <div class="kpi"><span>נאסף / התקבל בפועל</span><b>₪${fmt(t.collected)}</b><small>${fmt(t.collectedN)} איסופים ותרומות · ₪${fmt(t.reported)} מדווח לבדיקה</small></div>
    <div class="kpi"><span>סימנו "שמתי" היום</span><b>${fmt(t.checkinsToday)}</b><small>${chk}% מהקופות</small></div>
    <div class="kpi"><span>הצטרפו דרך הזמנה</span><b>${fmt(t.referred)}</b><small>${s.boxes?Math.round(t.referred/s.boxes*100):0}% מהנרשמים</small></div>
  </div>
  <div class="goal"><div style="display:flex;justify-content:space-between;font-weight:700"><span>יעד: ${fmt(st.goal)} קופות</span><span class="gt">${pct.toFixed(1)}%</span></div><div class="bar"><i style="width:${pct}%"></i></div><div style="color:var(--mut);font-size:13px;margin-top:8px">${O.status.map(x=>`${SL[x.k]||x.k}: <b style="color:var(--ink)">${fmt(x.n)}</b>`).join(' · ')||'עדיין אין נרשמים'}</div></div>
  <div class="g2"><div class="card"><h3>מפת הקופות <a href="#cities" style="color:var(--gold2);font-size:13px">לכל הערים ←</a></h3><div id="amap"></div></div>
    <div style="display:grid;gap:16px;align-content:start"><div class="card"><h3>לפי אזור</h3>${bars(O.regions)}</div><div class="card"><h3>ערים מובילות</h3>${bars(O.cities.slice(0,8))}</div></div></div>
  <div class="card" style="margin-top:16px"><h3>הרשמות ב-30 הימים האחרונים</h3><div class="spark">${days.map(d=>`<i style="height:${d.n/mx*100}%" data-t="${d.k.slice(5)}: ${d.n}"></i>`).join('')}</div></div>
  <div class="g3"><div class="card"><h3>שקלים ליום</h3>${bars(O.amounts,r=>'₪'+r.k)}</div><div class="card"><h3>מתי שמים</h3>${bars(O.prayers)}</div><div class="card"><h3>ערוץ תזכורת</h3>${bars(O.channels,r=>CHL[r.k]||r.k)}</div></div>
  <div class="card" style="margin-top:16px"><h3>שגרירים מובילים (הזמינו הכי הרבה)</h3>${O.topRefs.length?`<div class="tblw"><table><tr><th>קופה</th><th>שם</th><th>עיר</th><th>הצטרפו בזכותו</th></tr>${O.topRefs.map(r=>`<tr><td>#${r.box_no}</td><td>${esc(r.first+' '+r.last)}</td><td>${esc(r.city)}</td><td><b class="gt">${r.n}</b></td></tr>`).join('')}</table></div>`:'<div style="color:var(--mut)">עדיין אין הצטרפויות דרך קישורי הזמנה</div>'}</div>`;
  map('amap',O.cities)};
function map(id,cities){const el=document.getElementById(id);const M=window.ILMAP;if(!el||!M)return;const P=(a,b)=>M.p(a,b).map(v=>+v.toFixed(1));const mx=Math.max(1,...cities.map(c=>c.n));
  let pts='';cities.forEach(c=>{const g=CITY.find(c.k);if(!g)return;const [x,y]=P(g.lat,g.lng),r=(4+Math.sqrt(c.n/mx)*20).toFixed(1);pts+=`<circle cx="${x}" cy="${y}" r="${r}" fill="rgba(217,174,91,.45)" stroke="#f3d58a" stroke-width="1.2" data-k="${esc(c.k)}" style="cursor:pointer"><title>${esc(c.k)} · ${fmt(c.n)} קופות · ₪${fmt(c.d)} ליום · נמסרו ${fmt(c.del)} · ממתינות ${fmt(c.pend)}</title></circle>`});
  el.style.background='transparent';el.innerHTML=`<svg viewBox="-10 -10 ${M.W+20} ${M.H+20}" style="width:100%;height:100%"><path d="${M.land}" fill="rgba(246,239,224,.05)" stroke="rgba(217,174,91,.7)" stroke-width="1.4"/>${pts}</svg>`;
  el.querySelectorAll('circle[data-k]').forEach(c=>c.onclick=()=>{location.hash='#boxes';setTimeout(()=>{$('#fCity').value=c.dataset.k;loadBoxes()},400)})}
// ---- boxes ----
let SEL=new Set();
P.boxes=()=>{const regions=CITY.REGIONS.concat(['אחר']);$('#main').innerHTML=`<div class="h"><h1>קופות ומשלוחים</h1><span class="sp"></span><a class="btn sm ghost" id="exp">⬇ ייצוא לאקסל</a><a class="btn sm" id="disp" target="_blank">🖨 דף לשליח</a></div>
  <div class="fl"><input id="fQ" placeholder="חיפוש: שם, טלפון, רחוב, מס׳ קופה"><select id="fReg"><option value="">כל האזורים</option>${regions.map(r=>`<option>${r}</option>`).join('')}</select><select id="fCity"><option value="">כל הערים</option>${O.cities.map(c=>`<option value="${esc(c.k)}">${esc(c.k)} (${c.n})</option>`).join('')}</select><select id="fSt"><option value="">כל הסטטוסים</option>${Object.entries(SL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="fCo" placeholder="שליח" style="min-width:100px"></div>
  <div class="tblw"><table id="bt"></table></div><div class="bulk" id="bulk" hidden><b id="bN"></b><select class="s" id="bSt"><option value="">שינוי סטטוס…</option>${Object.entries(SL).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input class="s" id="bCo" placeholder="שיבוץ לשליח" list="couriers"><button class="btn sm" id="bGo">החלה</button><button class="btn sm ghost" id="bClr">ניקוי</button></div><datalist id="couriers"></datalist>`;
  ['fQ','fReg','fCity','fSt','fCo'].forEach(i=>$('#'+i).addEventListener(i==='fQ'||i==='fCo'?'input':'change',()=>{clearTimeout(window._lb);window._lb=setTimeout(loadBoxes,250)}));
  $('#bGo').onclick=async()=>{const b={ids:[...SEL]};if($('#bSt').value)b.box_status=$('#bSt').value;if($('#bCo').value.trim())b.courier=$('#bCo').value.trim();if(!b.box_status&&b.courier===undefined)return toast('בחרו סטטוס או שליח');if(b.courier&&!b.box_status)b.box_status='assigned';await api('/admin/members/bulk',{method:'POST',body:b});toast(`עודכנו ${SEL.size} קופות`);SEL.clear();loadBoxes()};
  $('#bClr').onclick=()=>{SEL.clear();loadBoxes()};loadBoxes()};
const qs=()=>new URLSearchParams({q:$('#fQ').value,region:$('#fReg').value,city:$('#fCity').value,status:$('#fSt').value,courier:$('#fCo').value}).toString();
async function loadBoxes(){const l=await api('/admin/members?'+qs());$('#exp').href='/api/admin/export.csv?'+qs();$('#disp').href='/admin/dispatch?'+qs();
  const cs=[...new Set(l.map(m=>m.courier).filter(Boolean))];$('#couriers').innerHTML=cs.map(c=>`<option value="${esc(c)}">`).join('');
  $('#bt').innerHTML=`<tr><th><input type="checkbox" id="all" style="width:16px;height:16px"></th><th>קופה</th><th>שם וטלפון</th><th>כתובת</th><th>₪/יום</th><th>סטטוס</th><th>שליח</th><th>תזכורת</th><th>נרשם</th></tr>`+(l.map(m=>`<tr><td><input type="checkbox" data-id="${m.id}" ${SEL.has(m.id)?'checked':''} style="width:16px;height:16px"></td><td><b>#${m.box_no}</b>${m.refs?`<small>הביא ${m.refs}</small>`:''}</td><td>${esc(m.first+' '+m.last)}<small dir="ltr" style="text-align:right">${esc(m.phone)}</small></td><td>${esc(m.street+' '+m.house+(m.apt?'/'+m.apt:''))}<small>${esc(m.city)} · ${esc(m.region)}</small></td><td>₪${m.amount}</td><td><select class="s" data-st="${m.id}">${Object.entries(SL).map(([k,v])=>`<option value="${k}" ${k===m.box_status?'selected':''}>${v}</option>`).join('')}</select></td><td><input class="s" data-co="${m.id}" value="${esc(m.courier)}" list="couriers" style="width:110px"></td><td><small>${CHL[m.remind_channel]} ${m.remind_channel!=='none'?m.remind_time:''}</small></td><td><small>${dt(m.created)}</small></td></tr>`).join('')||'<tr><td colspan="9" style="text-align:center;color:var(--mut);padding:30px">אין קופות שתואמות לסינון</td></tr>');
  $$('[data-st]').forEach(s=>s.onchange=async()=>{await api('/admin/members/'+s.dataset.st,{method:'PATCH',body:{box_status:s.value}});toast('עודכן')});
  $$('[data-co]').forEach(s=>s.onchange=async()=>{await api('/admin/members/'+s.dataset.co,{method:'PATCH',body:{courier:s.value}});toast('השליח עודכן')});
  const upd=()=>{$('#bulk').hidden=!SEL.size;$('#bN').textContent=`${SEL.size} נבחרו`};$$('[data-id]').forEach(c=>c.onchange=()=>{c.checked?SEL.add(+c.dataset.id):SEL.delete(+c.dataset.id);upd()});$('#all').onchange=e=>{$$('[data-id]').forEach(c=>{c.checked=e.target.checked;e.target.checked?SEL.add(+c.dataset.id):SEL.delete(+c.dataset.id)});upd()};upd()}
// ---- cities ----
P.cities=()=>{$('#main').innerHTML=`<div class="h"><h1>ערים ואזורים</h1></div><div class="g2" style="margin-top:0"><div class="card"><div id="cmap" style="height:640px;border-radius:16px;overflow:hidden"></div></div><div style="display:grid;gap:16px;align-content:start"><div class="card"><h3>אזורים</h3><div class="tblw"><table><tr><th>אזור</th><th>קופות</th><th>₪/יום</th><th>נמסרו</th></tr>${O.regions.map(r=>`<tr><td>${esc(r.k)}</td><td><b>${fmt(r.n)}</b></td><td>₪${fmt(r.d)}</td><td>${fmt(r.del)}</td></tr>`).join('')}</table></div></div>
  <div class="card"><h3>כל הערים (${O.cities.length})</h3><div class="tblw" style="max-height:420px"><table><tr><th>עיר</th><th>קופות</th><th>ממתינות</th><th>נמסרו</th><th></th></tr>${O.cities.map(c=>`<tr><td>${esc(c.k)}<small>${esc(c.region)}</small></td><td><b>${fmt(c.n)}</b></td><td>${fmt(c.pend)}</td><td>${fmt(c.del)}</td><td><a class="btn sm ghost" target="_blank" href="/admin/dispatch?city=${encodeURIComponent(c.k)}&status=new">דף שליח</a></td></tr>`).join('')}</table></div></div></div></div>`;map('cmap',O.cities)};
// ---- collections ----
P.coll=async()=>{const l=await api('/admin/collections');const KS={requested:'התבקש',scheduled:'נקבע',collected:'נאסף',cancelled:'בוטל',pending:'נפתח תשלום',reported:'דווח ששולם',paid:'אושר'};
  $('#main').innerHTML=`<div class="h"><h1>איסופים ותרומות</h1></div><div class="tblw"><table><tr><th>סוג</th><th>קופה</th><th>שם וכתובת</th><th>סכום</th><th>כוונה / מועד</th><th>סטטוס</th><th>פעולות</th></tr>${l.map(c=>`<tr><td>${c.kind==='pickup'?'🚚 איסוף':'✨ תרומה'}</td><td>#${c.box_no}</td><td>${esc(c.first+' '+c.last)}<small>${esc(c.street+' '+c.house+', '+c.city)} · <span dir="ltr">${esc(c.phone)}</span></small></td><td><b>₪${fmt(c.amount_actual||c.amount_est)}</b>${c.amount_actual?'':'<small>משוער</small>'}</td><td><small>${esc(c.kavana||c.preferred||'')}${c.note?' · '+esc(c.note):''}</small></td><td><span class="st ${['collected','paid'].includes(c.status)?'delivered':['cancelled'].includes(c.status)?'cancelled':'out'}">${KS[c.status]}</span><small>${dt(c.created)}</small></td><td><div style="display:flex;gap:6px;flex-wrap:wrap">${c.kind==='pickup'?(['requested','scheduled'].includes(c.status)?`${c.status==='requested'?`<button class="btn sm ghost" onclick="cSet(${c.id},'scheduled')">נקבע</button>`:''}<button class="btn sm" onclick="cSet(${c.id},'collected',1)">נאסף</button><button class="btn sm ghost" onclick="cSet(${c.id},'cancelled')">ביטול</button>`:''):(['pending','reported'].includes(c.status)?`<button class="btn sm" onclick="cSet(${c.id},'paid',1)">אושר בסליקה</button><button class="btn sm ghost" onclick="cSet(${c.id},'cancelled')">ביטול</button>`:'')}</div></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;color:var(--mut);padding:30px">אין עדיין בקשות</td></tr>'}</table></div>`};
async function cSet(id,status,amt){const b={status};if(amt){const v=prompt('סכום בפועל (₪):');if(v===null)return;b.amount_actual=+v||0}await api('/admin/collections/'+id,{method:'PATCH',body:b});toast('עודכן');route()}
// ---- reminders ----
P.rem=async()=>{const l=await api('/admin/reminders');const r=O.reminders;$('#main').innerHTML=`<div class="h"><h1>תזכורות</h1></div>
  <div class="kpis"><div class="kpi"><span>מייל</span><b>${r.email?'מחובר ✓':'לא מחובר'}</b><small>Resend · RESEND_API_KEY</small></div><div class="kpi"><span>SMS</span><b>${r.sms?'מחובר ✓':'לא מחובר'}</b><small>מגדירים בהגדרות</small></div><div class="kpi"><span>נשלחו היום</span><b>${fmt(r.sent)}</b></div><div class="kpi"><span>ממתינות לספק היום</span><b>${fmt(r.queued)}</b><small>וואטסאפ / שיחות / SMS לא מחובר</small></div></div>
  <div class="card" style="margin-top:16px"><h3>יומן אחרון</h3><div class="tblw"><table><tr><th>תאריך</th><th>קופה</th><th>שם</th><th>ערוץ</th><th>סטטוס</th></tr>${l.map(x=>`<tr><td>${x.day}</td><td>#${x.box_no}</td><td>${esc(x.first+' '+x.last)}<small dir="ltr" style="text-align:right">${esc(x.phone)}</small></td><td>${CHL[x.channel]}</td><td><span class="st ${x.status==='sent'?'delivered':x.status==='failed'?'new':'out'}">${x.status==='sent'?'נשלח':x.status==='failed'?'נכשל':'ממתין'}</span><small>${esc(x.info)}</small></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;color:var(--mut);padding:24px">עדיין לא נשלחו תזכורות</td></tr>'}</table></div></div>`};
// ---- settings ----
P.set=async()=>{const s=await api('/admin/settings');$('#main').innerHTML=`<div class="h"><h1>הגדרות</h1></div><div class="card grid">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><label>מחיר כרטיס לאומן (₪)<input id="sT" type="number" value="${s.ticketPrice}"></label><label>תאריך יעד (איסוף לפני ר"ה)<input id="sD" type="date" value="${s.targetDate}"></label><label>יעד קופות<input id="sG" type="number" value="${s.goal}"></label></div>
  <label>קישור לתרומה אונליין (נדרים פלוס / משולם / כל דף תשלום)<input id="sU" dir="ltr" value="${esc(s.donateUrl)}" placeholder="https://...?amount={amount}"><small style="color:var(--mut2);font-weight:400">אפשר לשלב {amount} {box} {name} {phone} {id}</small></label>
  <label>וואטסאפ לפניות (מוצג באתר)<input id="sW" dir="ltr" value="${esc(s.whatsapp)}" placeholder="0501234567"></label>
  <label>כתובת שליחת SMS (ספק כמו 019 / Inforu / Twilio)<input id="sS" dir="ltr" value="${esc(s.sms.url)}" placeholder="https://api.provider.com/send?to={phone}&msg={text}&key=..."><small style="color:var(--mut2);font-weight:400">המערכת שולחת POST לכתובת עם {phone} ו-{text}. בלי כתובת – התזכורות נרשמות כ"ממתינות לספק".</small></label>
  <label style="display:flex;flex-direction:row;gap:10px;align-items:center"><input type="checkbox" id="sR" ${s.showRecent?'checked':''} style="width:18px;height:18px;accent-color:var(--gold)">להציג באתר "דוד מצפת לקח קופה" (רק למי שאישר)</label>
  <button class="btn" id="sGo" style="justify-self:start">שמירה</button></div>`;
  $('#sGo').onclick=async()=>{await api('/admin/settings',{method:'PUT',body:{ticketPrice:$('#sT').value,targetDate:$('#sD').value,goal:$('#sG').value,donateUrl:$('#sU').value,whatsapp:$('#sW').value,smsUrl:$('#sS').value,showRecent:$('#sR').checked}});toast('נשמר ✓')}};
boot();
</script>
<script src="/a11y.js?v=2" defer></script>
</body>
</html>
