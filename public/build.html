<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>בונים קמפיין בשיחה · GiveIL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#faf9f7">
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1917;--mut:#78716c;--line:#e7e5e4;--soft:#f3f1ee;--card:#fff;--v:#7c5cff;--c:#22d3ee;--bg:#faf9f7;--vh:100dvh}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:Rubik,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
#app{position:absolute;top:0;left:0;right:0;height:var(--vh);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,430px);grid-template-rows:auto minmax(0,1fr)}
.top{grid-column:1/-1;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;padding-top:env(safe-area-inset-top);box-sizing:content-box;border-bottom:1px solid var(--line);background:rgba(250,249,247,.92)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}.logo img{width:26px}.logo b{color:#3b5bdb}
.tbtn{font-size:13.5px;font-weight:600;color:var(--ink);padding:8px 13px;border-radius:999px;background:var(--soft);border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tacts{display:flex;gap:6px;align-items:center}
#pvbtn{display:none}#pvbtn.new::after{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e}
/* chat column */
.chat{display:flex;flex-direction:column;min-height:0;min-width:0;border-inline-end:1px solid var(--line)}
.msgs{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px 16px 8px}
.in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.m{line-height:1.65;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .35s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.a{align-self:stretch;display:flex;gap:10px;align-items:flex-start}
.m.a::before{content:"✦";flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:#fff;background:linear-gradient(135deg,#4285f4,#9b72cb 55%,#d96570);margin-top:1px}
.m.a>span{flex:1;min-width:0;padding-top:1px}
.m.u{align-self:flex-end;max-width:86%;background:var(--soft);border-radius:20px;border-start-start-radius:6px;padding:10px 15px}
.m.u .th{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}.m.u .th img{width:72px;height:72px;object-fit:cover;border-radius:12px}
.m.typing>span{display:inline-flex;gap:5px;padding-top:10px}.m.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:dot 1.1s infinite}.m.typing i:nth-child(2){animation-delay:.15s}.m.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-5px);opacity:.5}}
.steps{display:flex;gap:6px;flex-wrap:wrap;max-width:720px;margin:0 auto;padding:10px 16px 0}
.steps span{font-size:11.5px;font-weight:600;color:var(--mut);background:var(--soft);border-radius:999px;padding:3px 9px;transition:.3s}
.steps span.ok{background:#dcfce7;color:#166534}.steps span.ok::before{content:"✓ "}
/* composer */
.dock{padding:6px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%)}
.dock>*{max-width:720px;margin-inline:auto}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 8px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;font-size:14px;font-weight:500;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.gl{position:relative;border-radius:28px}
.gl .halo,.gl .ring{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.gl .halo{filter:blur(16px);opacity:.38;transform:scale(1.01);transition:opacity .3s}
.gl:focus-within .halo{opacity:.7}
.gl .spin{position:absolute;top:50%;left:50%;width:220%;aspect-ratio:1;translate:-50% -50%;background:conic-gradient(#4285f4,#9b72cb,#d96570,#fbbc05,#34a853,#22d3ee,#4285f4);animation:sp 5s linear infinite}
@keyframes sp{to{rotate:360deg}}
.comp{position:relative;margin:2px;border-radius:26px;background:#fff;padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px}
.atts{display:flex;gap:8px;flex-wrap:wrap}.atts:empty{display:none}
.att{position:relative}.att img{width:64px;height:64px;object-fit:cover;border-radius:12px;display:block}
.att button{position:absolute;top:-6px;inset-inline-end:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center}
.comp textarea{width:100%;border:0;outline:0;resize:none;background:transparent;font:inherit;font-size:16px;line-height:1.5;max-height:150px;min-height:26px;padding:4px 4px 0;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer;color:var(--ink)}
.send{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;transition:.2s}
.send:disabled{background:#d6d3d1;cursor:default}
.note{font-size:11px;color:var(--mut);text-align:center;padding-top:6px;line-height:1.4}
/* preview */
.pv{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px;background:linear-gradient(160deg,#f3efff,#e8fbff 60%,#f0fff3);min-height:0}
.pv h4{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:10px}
.card{background:#fff;border-radius:22px;box-shadow:0 24px 60px -30px rgba(76,47,208,.45);overflow:hidden;border:1px solid rgba(124,92,255,.15)}
.cov{aspect-ratio:16/8;background:linear-gradient(135deg,#7c5cff,#22d3ee) center/cover;display:grid;place-items:center;color:#fff;padding:18px;text-align:center;position:relative}
.cov.img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(0,0,0,.55))}
.cov b{position:relative;z-index:1;font-size:22px;font-weight:800;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.cov small{position:absolute;z-index:1;top:10px;inset-inline-start:12px;background:rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
.bd{padding:16px 18px 18px}
.org{font-size:12.5px;color:var(--mut);font-weight:600}.sub{font-size:14.5px;line-height:1.5;margin-top:4px}
.goal{display:flex;align-items:baseline;gap:8px;margin-top:14px}.goal b{font-size:26px;font-weight:800}.goal span{font-size:13px;color:var(--mut)}
.bar{height:9px;border-radius:999px;background:var(--soft);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:8%;border-radius:999px;background:linear-gradient(90deg,var(--c),var(--v))}
.meta{font-size:12.5px;color:var(--mut);margin-top:8px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.lv div{border:1px solid var(--line);border-radius:14px;padding:10px;animation:in .4s both}
.lv b{display:block;font-size:17px;font-weight:800}.lv span{font-size:12.5px;font-weight:600}.lv small{display:block;font-size:11.5px;color:var(--mut);line-height:1.4;margin-top:2px}
.story{margin-top:14px;font-size:13.5px;line-height:1.7;color:#44403c}.story p{margin-bottom:8px}
.ph{color:#a8a29e;font-style:italic}.cov .ph{color:rgba(255,255,255,.8)}
.flash{animation:fl .9s}@keyframes fl{0%{background:#fef9c3}100%{background:transparent}}
.save{display:block;width:100%;margin-top:16px;border:0;border-radius:16px;min-height:52px;font-weight:700;font-size:16px;color:#fff;background:var(--ink);cursor:pointer}
.save:disabled{opacity:.35;cursor:default}
.save.ready{background:linear-gradient(135deg,#4285f4,#9b72cb 60%,#d96570);box-shadow:0 14px 30px -12px rgba(124,92,255,.7)}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 .chat{border:0}
 #pvbtn{display:inline-flex}
 .pv{position:fixed;inset:0;top:calc(54px + env(safe-area-inset-top));z-index:20;transform:translateY(102%);transition:transform .35s cubic-bezier(.22,1,.36,1);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
 body.showpv .pv{transform:none}
 .msgs{padding:14px 14px 6px}
 .note{display:none}
 body.kb .steps{display:none}
 .steps{padding-inline-start:62px}
}
.a11y-btn{bottom:auto!important;top:calc(62px + env(safe-area-inset-top))!important}
@media (prefers-reduced-motion:reduce){.gl .spin{animation-duration:20s}}
</style>
</head>
<body>
<div id="app">
 <div class="top"><a class="logo" href="/"><img src="/logo.svg" alt=""><span dir="ltr">Give<b>IL</b></span></a>
  <div class="tacts"><button class="tbtn" id="pvbtn">הטיוטה שלי</button><a class="tbtn" href="/">✕</a></div></div>
 <section class="chat">
  <div class="steps" id="steps"><span data-k="title">שם</span><span data-k="goal">יעד</span><span data-k="when">מועד</span><span data-k="levels">רמות תרומה</span><span data-k="story">סיפור</span></div>
  <div class="msgs" id="msgs"><div class="in" id="in" aria-live="polite"></div></div>
  <div class="dock">
   <div class="chips" id="chips"></div>
   <form class="gl" id="f"><div class="halo"><i class="spin"></i></div><div class="ring"><i class="spin"></i></div>
    <div class="comp"><div class="atts" id="atts"></div>
     <textarea id="t" rows="1" placeholder="כתבו כאן, או צרפו תמונה…" maxlength="1500" aria-label="הודעה" enterkeyhint="send" autocomplete="off" autocapitalize="sentences"></textarea>
     <div class="row"><button type="button" class="ib" id="plus" aria-label="צירוף תמונה" title="צירוף תמונה">+</button><button class="send" id="send" aria-label="שליחה" disabled>↑</button></div>
    </div></form>
   <input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/heic,image/*" multiple hidden>
   <div class="note">הבונה מופעל על ידי בינה מלאכותית (Claude). מה שתכתבו ותצרפו נשלח לעיבוד כדי לנסח את הטיוטה. אל תשלחו פרטים רגישים.</div>
  </div>
 </section>
 <aside class="pv" id="pv">
  <h4>הטיוטה שלכם · מתעדכנת תוך כדי שיחה</h4>
  <div class="card"><div class="cov" id="pCov"><small>תצוגה מקדימה</small><b id="pTitle" class="ph">שם הקמפיין יופיע כאן</b></div>
   <div class="bd"><div class="org" id="pOrg"></div><div class="sub ph" id="pSub">משפט אחד שמסביר את הקמפיין</div>
    <div class="goal"><b id="pGoal" class="ph">₪—</b><span>יעד הקמפיין</span></div><div class="bar"><i></i></div><div class="meta" id="pWhen"></div>
    <div class="lv" id="pLv"></div><div class="story" id="pStory"></div>
   </div></div>
  <button class="save" id="save" disabled>שמירת הקמפיין והמשך לעריכה</button>
  <div class="hint" id="saveHint">הכפתור ייפתח כשיהיו שם, יעד וסיפור</div>
 </aside>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₪'+Math.round(n).toLocaleString('en-US');const TOUCH=matchMedia('(hover:none) and (pointer:coarse)').matches;
let msgs=[],draft={},cover='',pend=[],busy=false,done=false;
try{const s=JSON.parse(sessionStorage.getItem('gvBuild')||'null');if(s&&Array.isArray(s.msgs)){msgs=s.msgs;draft=s.draft||{};done=!!s.done}}catch(e){}
try{cover=sessionStorage.getItem('gvCover')||''}catch(e){}
const persist=()=>{try{sessionStorage.setItem('gvBuild',JSON.stringify({msgs,draft,done}))}catch(e){}};

/* ---- keyboard-safe layout: the app is always exactly the visible viewport (like a native chat app) ---- */
const vv=window.visualViewport;let baseH=window.innerHeight;
function fit(){const h=vv?vv.height:window.innerHeight;const top=vv?vv.offsetTop:0;const app=$('app');app.style.height=h+'px';app.style.transform=top?`translateY(${top}px)`:'';
 document.body.classList.toggle('kb',baseH-h>120);if(document.activeElement===$('t'))toEnd(false)}
if(vv){vv.addEventListener('resize',fit);vv.addEventListener('scroll',fit)}addEventListener('resize',()=>{if(!document.body.classList.contains('kb'))baseH=window.innerHeight;fit()});addEventListener('orientationchange',()=>setTimeout(()=>{baseH=window.innerHeight;fit()},300));
window.addEventListener('scroll',()=>{if(window.scrollY)window.scrollTo(0,0)});
function toEnd(smooth=true){const m=$('msgs');requestAnimationFrame(()=>m.scrollTo({top:m.scrollHeight,behavior:smooth?'smooth':'auto'}))}

function bubble(role,text,imgs){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');
 if(role==='user'){if(imgs&&imgs.length){const th=document.createElement('div');th.className='th';imgs.forEach(u=>{const i=new Image();i.src=u;i.alt='';th.appendChild(i)});d.appendChild(th)}d.appendChild(document.createTextNode(text))}
 else{const s=document.createElement('span');s.innerHTML=md(text);d.appendChild(s)}
 $('in').appendChild(d);toEnd();return d}
function md(t){return esc(t).replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>')}
function setTxt(id,val,ph){const e=$(id);const had=e.textContent;if(val){e.classList.remove('ph');if(had!==val){e.textContent=val;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}}else{e.classList.add('ph');e.textContent=ph}}
function render(){const d=draft||{};
 setTxt('pTitle',d.title,'שם הקמפיין יופיע כאן');setTxt('pSub',d.subtitle,'משפט אחד שמסביר את הקמפיין');$('pOrg').textContent=d.org||'';
 setTxt('pGoal',d.goal>0?fmt(d.goal):'','₪—');
 const cv=$('pCov');cv.classList.toggle('img',!!cover);cv.style.backgroundImage=cover?`url("${cover}")`:'';
 const w=[];if(d.start)w.push('מתחיל ב-'+d.start.split('-').reverse().join('.'));if(d.days)w.push(d.days+' ימים');$('pWhen').textContent=w.join(' · ');
 $('pLv').innerHTML=(d.levels||[]).map(l=>`<div><b>${fmt(l.amount)}</b><span>${esc(l.name)}</span>${l.descr?`<small>${esc(l.descr)}</small>`:''}</div>`).join('');
 $('pStory').innerHTML=d.story?d.story.split(/\n{2,}/).map(p=>`<p>${md(p).replace(/\n/g,'<br>')}</p>`).join(''):'';
 const ok={title:!!d.title,goal:d.goal>0,when:!!(d.days||d.start),levels:(d.levels||[]).length>=2,story:!!d.story};
 document.querySelectorAll('#steps span').forEach(s=>s.classList.toggle('ok',!!ok[s.dataset.k]));
 const can=ok.title&&ok.goal&&ok.story;$('save').disabled=!can;$('save').classList.toggle('ready',can&&done);$('saveHint').textContent=can?'אפשר לערוך הכול גם אחרי השמירה':'הכפתור ייפתח כשיהיו שם, יעד וסיפור'}
function chips(list){$('chips').innerHTML=(list||[]).map(c=>`<button type="button">${esc(c)}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>send(b.textContent)})}
function canSend(){$('send').disabled=busy||(!$('t').value.trim()&&!pend.length)}
function grow(){const t=$('t');t.style.height='auto';t.style.height=Math.min(150,t.scrollHeight)+'px';canSend()}

/* ---- attachments: resized in the browser, sent with the message ---- */
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{let q=.82,max=1280,out='';for(let k=0;k<5;k++){const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<600000)break;max=Math.round(max*.8);q-=.08}URL.revokeObjectURL(url);out.length<620000?res(out):rej()};im.onerror=()=>{URL.revokeObjectURL(url);rej()};im.src=url})}
function drawAtts(){$('atts').innerHTML=pend.map((u,i)=>`<div class="att"><img src="${u}" alt=""><button type="button" data-i="${i}" aria-label="הסרה">✕</button></div>`).join('');$('atts').querySelectorAll('button').forEach(b=>b.onclick=()=>{pend.splice(+b.dataset.i,1);drawAtts()});canSend()}
$('plus').onclick=()=>$('file').click();
$('file').onchange=async e=>{for(const f of [...e.target.files].slice(0,3-pend.length)){try{pend.push(await shrink(f))}catch(x){bubble('assistant','לא הצלחתי לקרוא את התמונה הזו. נסו תמונה אחרת (JPG או PNG).')}}e.target.value='';drawAtts();if(!TOUCH)$('t').focus()};
$('t').addEventListener('paste',async e=>{const fs=[...(e.clipboardData&&e.clipboardData.files||[])].filter(f=>f.type.startsWith('image/'));if(!fs.length)return;e.preventDefault();for(const f of fs.slice(0,3-pend.length)){try{pend.push(await shrink(f))}catch(x){}}drawAtts()});

async function send(text){text=String(text||'').trim();const imgs=pend.slice();if((!text&&!imgs.length)||busy)return;if(!text)text='צירפתי תמונה';
 busy=true;chips([]);pend=[];drawAtts();
 if(imgs.length&&!cover){cover=imgs[0];try{sessionStorage.setItem('gvCover',cover)}catch(e){}render()}
 msgs.push({role:'user',content:text+(imgs.length?' [צורפו '+imgs.length+' תמונות]':'')});bubble('user',text,imgs);$('t').value='';grow();
 const ty=document.createElement('div');ty.className='m a typing';ty.innerHTML='<span><i></i><i></i><i></i></span>';$('in').appendChild(ty);toEnd();
 try{const r=await fetch('/api/build/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:msgs,draft,images:imgs})});const j=await r.json().catch(()=>({}));ty.remove();
  if(!r.ok){msgs.pop();bubble('assistant',j.error||'משהו השתבש, נסו שוב');$('t').value=text;grow()}
  else{msgs.push({role:'assistant',content:j.reply});bubble('assistant',j.reply);const before=JSON.stringify(draft);draft=j.draft||draft;done=!!j.done;if(JSON.stringify(draft)!==before)$('pvbtn').classList.add('new');render();chips(j.chips);persist()}
 }catch(e){ty.remove();msgs.pop();bubble('assistant','החיבור נקטע, נסו לשלוח שוב');$('t').value=text;grow()}
 busy=false;canSend();if(!TOUCH)$('t').focus()}
$('t').addEventListener('input',grow);
$('t').addEventListener('focus',()=>setTimeout(()=>toEnd(false),250));
// desktop: Enter sends, Shift+Enter is a new line. phones: Enter is a new line and the arrow sends (as in chat apps)
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&!TOUCH){e.preventDefault();send($('t').value)}});
// keep the keyboard open when tapping send / + / chips
['send','plus'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.preventDefault()));
$('f').onsubmit=e=>{e.preventDefault();send($('t').value)};
$('pvbtn').onclick=()=>{$('t').blur();const on=document.body.classList.toggle('showpv');$('pvbtn').textContent=on?'חזרה לשיחה':'הטיוטה שלי';$('pvbtn').classList.remove('new')};
$('save').onclick=async()=>{const d={...draft,at:Date.now()};try{localStorage.setItem('gvDraft',JSON.stringify({...d,cover}))}catch(e){try{localStorage.setItem('gvDraft',JSON.stringify(d))}catch(x){}}
 let logged=false;try{const r=await fetch('/api/me');const j=await r.json();logged=!!(j&&j.user)}catch(e){}
 try{sessionStorage.removeItem('gvBuild');sessionStorage.removeItem('gvCover')}catch(e){}
 location.href=logged?'/app':'/app#reg'};
// start
(async()=>{fit();const st=await fetch('/api/build/status').then(r=>r.json()).catch(()=>({on:false}));
 if(!st.on){bubble('assistant','הבונה החכם עוד לא פעיל. אפשר לפתוח חשבון ולבנות את הקמפיין בעורך הרגיל.');$('t').disabled=true;$('plus').disabled=true;const a=document.createElement('a');a.href='/app#reg';a.className='tbtn';a.style.alignSelf='flex-start';a.textContent='לפתיחת חשבון ←';$('in').appendChild(a);return}
 render();
