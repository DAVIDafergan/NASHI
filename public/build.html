<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>בונים קמפיין בשיחה · GiveIL</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fafaf9">
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1917;--mut:#78716c;--line:#e7e5e4;--soft:#f5f4f1;--card:#fff;--v:#7c5cff;--c:#22d3ee;--bg:#fafaf9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
a{color:inherit;text-decoration:none}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#fff}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}.logo img{width:28px}.logo b{color:#3b5bdb}
.top .x{font-size:14px;color:var(--mut);padding:8px 12px;border-radius:999px;background:var(--soft)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);height:calc(100% - 58px)}
/* chat */
.chat{display:flex;flex-direction:column;min-height:0;border-inline-end:1px solid var(--line)}
.steps{display:flex;gap:6px;padding:12px 18px 0;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:600;color:var(--mut);background:var(--soft);border-radius:999px;padding:4px 10px;transition:.3s}
.steps span.ok{background:#dcfce7;color:#166534}.steps span.ok::before{content:"✓ "}
.msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.m{max-width:min(560px,86%);padding:12px 15px;border-radius:18px;line-height:1.6;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere;animation:in .35s cubic-bezier(.22,1,.36,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.m.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-start-start-radius:6px}
.m.u{align-self:flex-end;background:var(--ink);color:#fff;border-start-end-radius:6px}
.m.a.typing{display:inline-flex;gap:5px;padding:16px 18px}.m.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:dot 1.1s infinite}.m.typing i:nth-child(2){animation-delay:.15s}.m.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-5px);opacity:.5}}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 18px 10px}
.chips button{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--v);color:var(--v)}
.inp{display:flex;gap:8px;align-items:flex-end;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
.inp textarea{flex:1;font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;resize:none;max-height:140px;min-height:48px;outline:none;line-height:1.5;background:var(--bg)}
.inp textarea:focus{border-color:var(--v);background:#fff}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--c),var(--v));color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.send:disabled{opacity:.4;cursor:default}
.note{font-size:11.5px;color:var(--mut);text-align:center;padding:0 18px 8px;background:#fff}
/* preview */
.pv{overflow-y:auto;padding:20px;background:linear-gradient(160deg,#f3efff,#e8fbff 60%,#f0fff3)}
.pv h4{font-size:12px;font-weight:700;color:var(--mut);letter-spacing:.04em;margin-bottom:10px}
.card{background:#fff;border-radius:22px;box-shadow:0 24px 60px -30px rgba(76,47,208,.45);overflow:hidden;border:1px solid rgba(124,92,255,.15)}
.cov{aspect-ratio:16/8;background:linear-gradient(135deg,#7c5cff,#22d3ee);display:grid;place-items:center;color:#fff;padding:18px;text-align:center;position:relative}
.cov b{font-size:clamp(20px,2.4vw,26px);font-weight:800;line-height:1.2;text-shadow:0 2px 14px rgba(0,0,0,.25)}
.cov small{position:absolute;top:10px;inset-inline-start:12px;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600}
.bd{padding:16px 18px 18px}
.org{font-size:12.5px;color:var(--mut);font-weight:600}
.sub{font-size:14.5px;line-height:1.5;margin-top:4px}
.goal{display:flex;align-items:baseline;gap:8px;margin-top:14px}.goal b{font-size:26px;font-weight:800}.goal span{font-size:13px;color:var(--mut)}
.bar{height:9px;border-radius:999px;background:var(--soft);margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:8%;border-radius:999px;background:linear-gradient(90deg,var(--c),var(--v))}
.meta{font-size:12.5px;color:var(--mut);margin-top:8px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.lv div{border:1px solid var(--line);border-radius:14px;padding:10px;animation:in .4s both}
.lv b{display:block;font-size:17px;font-weight:800}.lv span{font-size:12.5px;font-weight:600}.lv small{display:block;font-size:11.5px;color:var(--mut);line-height:1.4;margin-top:2px}
.story{margin-top:14px;font-size:13.5px;line-height:1.7;color:#44403c}.story p{margin-bottom:8px}
.ph{color:#a8a29e;font-style:italic}
.flash{animation:fl .9s}@keyframes fl{0%{background:#fef9c3}100%{background:transparent}}
.save{display:block;width:100%;margin-top:16px;border:0;border-radius:16px;min-height:52px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--ink);cursor:pointer;transition:.2s}
.save:disabled{opacity:.35;cursor:default}
.save.ready{background:linear-gradient(135deg,var(--c),var(--v));box-shadow:0 14px 30px -12px rgba(124,92,255,.7);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.02)}}
.hint{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.pvbtn{display:none}
@media(max-width:860px){
 .wrap{grid-template-columns:1fr}
 .chat{border:0}
 .pv{position:fixed;inset:58px 0 0 0;z-index:20;transform:translateY(102%);transition:transform .35s cubic-bezier(.22,1,.36,1)}
 body.showpv .pv{transform:none}
 .pvbtn{display:flex;align-items:center;gap:6px;position:fixed;top:68px;inset-inline-end:12px;z-index:25;border:0;border-radius:999px;padding:9px 14px;font:inherit;font-weight:700;font-size:13.5px;background:var(--ink);color:#fff;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);cursor:pointer}
 .pvbtn.new::after{content:"";width:8px;height:8px;border-radius:50%;background:#22c55e}
 .steps{padding-inline-end:150px}
 .m{font-size:15px}
}
</style>
</head>
<body>
<div class="top"><a class="logo" href="/"><img src="/logo.svg" alt=""><span dir="ltr">Give<b>IL</b></span></a><a class="x" href="/">חזרה לאתר</a></div>
<button class="pvbtn" id="pvbtn">👁 הטיוטה שלי</button>
<div class="wrap">
 <section class="chat">
  <div class="steps" id="steps"><span data-k="title">שם</span><span data-k="goal">יעד</span><span data-k="when">מועד</span><span data-k="levels">רמות תרומה</span><span data-k="story">סיפור</span></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <form class="inp" id="f"><textarea id="t" rows="1" placeholder="כתבו כאן…" maxlength="1500" aria-label="הודעה"></textarea><button class="send" id="send" aria-label="שליחה">↑</button></form>
  <div class="note">הבונה מופעל על ידי בינה מלאכותית (Claude). מה שתכתבו נשלח לעיבוד כדי לנסח את הטיוטה. אל תכתבו פרטים רגישים.</div>
 </section>
 <aside class="pv" id="pv">
  <h4>הטיוטה שלכם · מתעדכנת תוך כדי שיחה</h4>
  <div class="card"><div class="cov"><small>תצוגה מקדימה</small><b id="pTitle" class="ph">שם הקמפיין יופיע כאן</b></div>
   <div class="bd"><div class="org" id="pOrg"></div><div class="sub ph" id="pSub">משפט אחד שמסביר את הקמפיין</div>
    <div class="goal"><b id="pGoal" class="ph">₪—</b><span>יעד הקמפיין</span></div><div class="bar"><i></i></div><div class="meta" id="pWhen"></div>
    <div class="lv" id="pLv"></div><div class="story" id="pStory"></div>
   </div></div>
  <button class="save" id="save" disabled>שמירת הקמפיין והמשך לעריכה</button>
  <div class="hint" id="saveHint">הכפתור ייפתח כשיהיו שם, יעד וסיפור</div>
 </aside>
</div>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₪'+Math.round(n).toLocaleString('en-US');
let msgs=[],draft={},busy=false,done=false;
try{const s=JSON.parse(sessionStorage.getItem('gvBuild')||'null');if(s&&Array.isArray(s.msgs)){msgs=s.msgs;draft=s.draft||{};done=!!s.done}}catch(e){}
const persist=()=>{try{sessionStorage.setItem('gvBuild',JSON.stringify({msgs,draft,done}))}catch(e){}};
function bubble(role,text){const d=document.createElement('div');d.className='m '+(role==='user'?'u':'a');d.textContent=text;$('msgs').appendChild(d);$('msgs').scrollTop=1e9;return d}
function md(t){return esc(t).replace(/\*\*([^*\n]+?)\*\*/g,'<b>$1</b>')}
function setTxt(id,val,ph){const e=$(id);const had=e.textContent;if(val){e.classList.remove('ph');if(had!==val){e.textContent=val;e.classList.remove('flash');void e.offsetWidth;e.classList.add('flash')}}else{e.classList.add('ph');e.textContent=ph}}
function render(){const d=draft||{};
 setTxt('pTitle',d.title,'שם הקמפיין יופיע כאן');setTxt('pSub',d.subtitle,'משפט אחד שמסביר את הקמפיין');$('pOrg').textContent=d.org||'';
 setTxt('pGoal',d.goal>0?fmt(d.goal):'','₪—');
 const w=[];if(d.start)w.push('מתחיל ב-'+d.start.split('-').reverse().join('.'));if(d.days)w.push(d.days+' ימים');$('pWhen').textContent=w.join(' · ');
 $('pLv').innerHTML=(d.levels||[]).map(l=>`<div><b>${fmt(l.amount)}</b><span>${esc(l.name)}</span>${l.descr?`<small>${esc(l.descr)}</small>`:''}</div>`).join('');
 $('pStory').innerHTML=d.story?d.story.split(/\n{2,}/).map(p=>`<p>${md(p).replace(/\n/g,'<br>')}</p>`).join(''):'';
 const ok={title:!!d.title,goal:d.goal>0,when:!!(d.days||d.start),levels:(d.levels||[]).length>=2,story:!!d.story};
 document.querySelectorAll('#steps span').forEach(s=>s.classList.toggle('ok',!!ok[s.dataset.k]));
 const can=ok.title&&ok.goal&&ok.story;$('save').disabled=!can;$('save').classList.toggle('ready',can&&done);$('saveHint').textContent=can?'הטיוטה נשמרת אצלכם, ואפשר לערוך הכול אחר כך':'הכפתור ייפתח כשיהיו שם, יעד וסיפור'}
function chips(list){$('chips').innerHTML=(list||[]).map(c=>`<button type="button">${esc(c)}</button>`).join('');$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>send(b.textContent))}
async function send(text){text=String(text||'').trim();if(!text||busy)return;busy=true;$('send').disabled=true;chips([]);
 msgs.push({role:'user',content:text});bubble('user',text);$('t').value='';grow();
 const ty=document.createElement('div');ty.className='m a typing';ty.innerHTML='<i></i><i></i><i></i>';$('msgs').appendChild(ty);$('msgs').scrollTop=1e9;
 try{const r=await fetch('/api/build/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:msgs,draft})});const j=await r.json().catch(()=>({}));ty.remove();
  if(!r.ok){msgs.pop();bubble('assistant',j.error||'משהו השתבש, נסו שוב');$('t').value=text}
  else{msgs.push({role:'assistant',content:j.reply});bubble('assistant',j.reply);const before=JSON.stringify(draft);draft=j.draft||draft;done=!!j.done;if(JSON.stringify(draft)!==before)$('pvbtn').classList.add('new');render();chips(j.chips);persist()}
 }catch(e){ty.remove();msgs.pop();bubble('assistant','החיבור נקטע, נסו לשלוח שוב');$('t').value=text}
 busy=false;$('send').disabled=false;if(matchMedia('(min-width:861px)').matches)$('t').focus()}
function grow(){const t=$('t');t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'}
$('t').addEventListener('input',grow);
$('t').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('t').value)}});
$('f').onsubmit=e=>{e.preventDefault();send($('t').value)};
$('pvbtn').onclick=()=>{const on=document.body.classList.toggle('showpv');$('pvbtn').textContent=on?'💬 חזרה לשיחה':'👁 הטיוטה שלי';$('pvbtn').classList.remove('new')};
$('save').onclick=async()=>{try{localStorage.setItem('gvDraft',JSON.stringify({...draft,at:Date.now()}))}catch(e){}
 let logged=false;try{const r=await fetch('/api/me');const j=await r.json();logged=!!(j&&j.user)}catch(e){}
 try{sessionStorage.removeItem('gvBuild')}catch(e){}
 location.href=logged?'/app':'/app#reg'};
// start
(async()=>{const st=await fetch('/api/build/status').then(r=>r.json()).catch(()=>({on:false}));
 if(!st.on){bubble('assistant','הבונה החכם עוד לא פעיל. אפשר לפתוח חשבון ולבנות את הקמפיין בעורך הרגיל.');$('t').disabled=true;$('send').disabled=true;const a=document.createElement('a');a.href='/app#reg';a.className='m a';a.style.fontWeight='700';a.textContent='לפתיחת חשבון ←';$('msgs').appendChild(a);return}
 render();
 if(msgs.length){msgs.forEach(m=>bubble(m.role,m.content));return}
 let first='';try{first=sessionStorage.getItem('gvFirst')||'';sessionStorage.removeItem('gvFirst')}catch(e){}
 if(first)send(first);else{bubble('assistant','שלום! אני אבנה איתכם את הקמפיין, שלב אחרי שלב.\nספרו לי בכמה מילים: על מה אתם רוצים לגייס, ולמי?');chips(['ספר תורה לבית הכנסת','חבילות מזון לחג','בניין חדש למוסד']);$('t').focus()}
})();
</script>
<script src="/a11y.js?v=5" defer></script>
</body>
</html>
