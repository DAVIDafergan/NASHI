<style>body{background:var(--night);color:#fff;min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px 20px;overflow-x:hidden}
body:before{content:"";position:fixed;width:900px;height:900px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(233,190,92,.22),transparent);pointer-events:none}
main{position:relative;width:100%;max-width:560px}main>img{width:64px;margin:0 auto 6px;animation:lpop 1.2s cubic-bezier(.2,1.4,.4,1) both}
.prz{margin:16px 0 0;border-radius:22px;overflow:hidden;border:2px solid rgba(233,190,92,.55);box-shadow:0 0 0 6px rgba(233,190,92,.1),0 24px 60px -20px rgba(233,190,92,.45);background:#f6e2c8}.prz img{display:block;width:100%;height:auto}.prz figcaption{background:var(--gold2);color:#161A2C;font-weight:800;font-size:14px;padding:9px 10px;line-height:1.4}
.brand{font-size:22px;font-weight:800;letter-spacing:.01em}
h1{font-size:clamp(34px,8.5vw,60px);line-height:1.12;margin-top:18px}h1 b{color:var(--gold2)}
p.sub{font-size:17px;color:rgba(255,255,255,.75);margin-top:12px;line-height:1.55}
.meter{margin:26px auto 0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:20px 18px}
.big{font-size:54px;font-weight:900;line-height:1;color:var(--gold2);font-variant-numeric:tabular-nums}.big small{font-size:22px;color:rgba(255,255,255,.7);font-weight:700}
.lbl2{font-size:14px;color:rgba(255,255,255,.7);margin-top:6px}
.track{height:14px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}
.track i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#e9be5c,#f6dc9a);transition:width 1.4s cubic-bezier(.22,1,.36,1)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px}
.dots span{aspect-ratio:1;border-radius:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center;font-size:13px;transition:.4s}
.dots span.on{background:var(--gold2);border-color:var(--gold2);color:#161A2C;transform:scale(1.04)}
.left{font-size:15px;margin-top:12px;font-weight:600}
.btns{display:grid;gap:10px;margin-top:22px}
.b1,.b2{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;font-weight:800;font-size:17px;border:0;cursor:pointer;font-family:inherit;text-decoration:none}
.b1{background:#25D366;color:#06301a}.b2{background:var(--gold2);color:#161A2C}
.hint{font-size:13px;color:rgba(255,255,255,.55);margin-top:10px}
.sep{height:1px;background:rgba(255,255,255,.12);margin:24px 0 18px}
.bizt{font-size:15px;color:rgba(255,255,255,.75);margin-bottom:10px}</style></head>
<body><main><img src="/logo.svg" alt=""><div class="brand">רעננים</div>
<figure class="prz"><picture><source media="(max-width:700px)" srcset="/img/prizes-hero-m.jpg"><img src="/img/prizes-hero.jpg" alt="הפרסים במבצע: טיסה זוגית, מלון, קורקינט חשמלי, אוזניות, ארוחה זוגית, יום ספא, כרטיסים להופעה ומתנות" width="1800" height="1005"></picture><figcaption>🎁 טיסה זוגית לאירופה · מלון · קורקינט חשמלי · אוזניות · ספא זוגי ועוד</figcaption></figure><h1>משיקים כש-<b id="g1">20</b> עסקים<br>מצטרפים</h1>
<p class="sub">מבצע הקניות של רעננה: קונים בעסקים של העיר, וזוכים בגדול. ברגע שנרשמים <span id="g2">20</span> עסקים, יוצאים לדרך.</p>
<div class="meter"><div class="big"><span id="jn">0</span><small> / <span id="g3">20</span></small></div><div class="lbl2">עסקים כבר בפנים</div>
<div class="track"><i id="tr"></i></div><div class="dots" id="dots"></div><div class="left" id="left"></div></div>
<div class="btns"><button class="b1" id="share">📣 שתפו עם בעלי עסקים ברעננה</button></div>
<div class="hint">מכירים חנות, מסעדה או נותן שירות בעיר? שלחו להם, וההשקה מתקרבת.</div>
<div class="sep"></div>
<div class="bizt">בעלי עסק ברעננה?</div>
<a class="b2" href="/business.html">להצטרפות עסק ←</a>
</main>
<script>
fetch('/api/biz/price').then(r=>r.json()).then(d=>{const g=d.goal||20,j=Math.min(d.joined||0,g);['g1','g2','g3'].forEach(i=>document.getElementById(i).textContent=g);
const ds=document.getElementById('dots');ds.innerHTML=Array.from({length:g},(_,i)=>'<span></span>').join('');
let n=0;const el=document.getElementById('jn');const t=setInterval(()=>{if(n>=j){clearInterval(t);return}n++;el.textContent=n;ds.children[n-1].classList.add('on');ds.children[n-1].textContent='🏪'},120);
requestAnimationFrame(()=>document.getElementById('tr').style.width=(j/g*100)+'%');
document.getElementById('left').textContent=j>=g?'הגענו! ההשקה ממש בקרוב 🎉':'חסרים עוד '+(g-j)+' עסקים להשקה';
window.__g=g;window.__j=j}).catch(()=>{});
document.getElementById('share').onclick=async()=>{const g=window.__g||20,j=window.__j||0;const url=location.origin+'/';const text='רעננים – מבצע הקניות של רעננה 🎁\nמשיקים כש-'+g+' עסקים מצטרפים'+(j?' (כבר '+j+' בפנים)':'')+'.\nמכירים בעל עסק בעיר? שלחו לו:';
try{if(navigator.share){await navigator.share({title:'רעננים',text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
location.href='https://wa.me/?text='+encodeURIComponent(text+'\n'+url)};
</script><script src="/a11y.js"></script></body></html>
