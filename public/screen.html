<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מסך אירוע</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--c:#2563eb}*{box-sizing:border-box;margin:0;padding:0}
body{font:400 16px/1.4 Heebo,sans-serif;background:#0b1020;color:#fff;height:100vh;overflow:hidden;container-type:size}
.bg{position:fixed;inset:0;background:radial-gradient(60% 60% at 20% 0%,color-mix(in srgb,var(--c) 40%,transparent),transparent 60%),radial-gradient(50% 50% at 90% 100%,color-mix(in srgb,var(--c) 25%,transparent),transparent 60%)}
.g{position:relative;height:100%;display:grid;grid-template-columns:1.1fr .9fr;gap:4cqw;padding:5cqh 5cqw}
.l{display:flex;flex-direction:column;justify-content:center;gap:3cqh}
.logo{height:12cqh;width:auto;object-fit:contain;align-self:flex-start}
h1{font-size:6cqh;font-weight:900;line-height:1.1}
.sub{font-size:2.6cqh;opacity:.8}
.big{font-size:11cqh;font-weight:900;line-height:1;color:#fff;letter-spacing:-.02em}
.big small{font-size:3cqh;opacity:.7;font-weight:400;margin-inline-start:1cqw}
.bar{height:3cqh;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#fff);border-radius:99px;width:0;transition:width 1.5s cubic-bezier(.22,1,.36,1)}
.meta{display:flex;gap:4cqw;font-size:3cqh}.meta b{font-weight:900}
.timer{display:flex;gap:2cqw;font-size:2.2cqh;opacity:.85}.timer b{font-size:4.5cqh;font-weight:900;display:block;line-height:1}
.r{display:flex;flex-direction:column;gap:1.4cqh;overflow:hidden;justify-content:flex-start}
.r h2{font-size:3cqh;opacity:.7;font-weight:400;letter-spacing:.1em}
.d{display:flex;align-items:center;gap:1.5cqw;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:1.5cqh;padding:1.6cqh 2cqw;animation:in 1s cubic-bezier(.22,1,.36,1)}
.d:first-of-type{background:color-mix(in srgb,var(--c) 45%,transparent);border-color:color-mix(in srgb,var(--c) 70%,#fff);transform:scale(1.03)}
@keyframes in{from{opacity:0;transform:translateY(-3cqh)}}
.d .av{width:5.5cqh;height:5.5cqh;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:900;font-size:2.6cqh;flex:none}
.d .n{flex:1;min-width:0}.d b{font-size:3cqh;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.d small{font-size:2cqh;opacity:.75;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d .a{font-size:3.6cqh;font-weight:900;white-space:nowrap}
.pop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,16,32,.85);opacity:0;pointer-events:none;transition:.5s;z-index:5}
.pop.on{opacity:1}
.pop div{text-align:center;animation:zoom .8s cubic-bezier(.22,1,.36,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.pop .pa{font-size:16cqh;font-weight:900;color:#fff;line-height:1}.pop .pn{font-size:6cqh;font-weight:700;margin-top:2cqh}.pop .pd{font-size:3.5cqh;opacity:.8;margin-top:1cqh}
.qr{position:fixed;bottom:3cqh;inset-inline-start:3cqw;display:flex;gap:1.5cqw;align-items:center;font-size:2.2cqh;opacity:.9}.qr img{width:12cqh;height:12cqh;border-radius:1cqh;background:#fff;padding:.6cqh}
@media(orientation:portrait){.g{grid-template-columns:1fr;grid-template-rows:auto 1fr}.big{font-size:9cqh}}
</style></head><body><div class="bg"></div>
<div class="g"><div class="l"><img class="logo" id="logo" alt="" hidden><div><h1 id="t"></h1><div class="sub" id="s"></div></div><div class="big"><span id="raised">0</span><small id="goal"></small></div><div class="bar"><i id="bar"></i></div><div class="meta"><span><b id="pct">0%</b> מהיעד</span><span><b id="cnt">0</b> תורמים</span><span id="mult" hidden>✕<b id="m"></b> מאצ'ינג</span></div><div class="timer" id="timer"></div></div>
<div class="r"><h2>התורמים האחרונים</h2><div id="list"></div></div></div>
<div class="pop" id="pop"><div><div class="pa" id="pa"></div><div class="pn" id="pn"></div><div class="pd" id="pd"></div></div></div>
<div class="qr"><img id="qr" alt=""><div>סרקו לתרומה<br><b id="url"></b></div></div>
<script>
const slug=location.pathname.split('/')[2];const $=s=>document.querySelector(s);const fmt=n=>Math.round(n).toLocaleString('he-IL');let D,cur='₪';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row=d=>`<div class="d"><div class="av">${esc((d.anonymous||!d.name?'א':d.name)[0])}</div><div class="n"><b>${d.anonymous||!d.name?'תורם אנונימי':esc(d.name)}</b>${d.dedication?`<small>${esc(d.dedication)}</small>`:''}</div><div class="a">${cur}${fmt(d.amount)}</div></div>`;
function stats(s){$('#raised').textContent=cur+fmt(s.total);$('#goal').textContent='מתוך '+cur+fmt(s.goal);$('#pct').textContent=s.pct+'%';$('#cnt').textContent=s.count;requestAnimationFrame(()=>$('#bar').style.width=Math.min(100,s.pct)+'%')}
function timer(){const end=new Date(D.campaign.end_at)-Date.now();if(end<=0){$('#timer').textContent='הקמפיין הסתיים';return}const d=Math.floor(end/864e5),h=Math.floor(end%864e5/36e5),m=Math.floor(end%36e5/6e4),s=Math.floor(end%6e4/1e3);$('#timer').innerHTML=[[d,'ימים'],[h,'שעות'],[m,'דקות'],[s,'שניות']].map(([v,l])=>`<span><b>${String(v).padStart(2,'0')}</b>${l}</span>`).join('')}
fetch('/api/c/'+slug).then(r=>r.json()).then(j=>{D=j;const c=j.campaign;cur=c.currency==='USD'?'$':'₪';document.documentElement.style.setProperty('--c',c.color);$('#t').textContent=c.title;$('#s').textContent=c.subtitle;if(c.logo){$('#logo').src=c.logo;$('#logo').hidden=false}if(c.multiplier>1){$('#mult').hidden=false;$('#m').textContent=c.multiplier}
  const url=location.origin+'/c/'+slug;$('#url').textContent=url.replace(/^https?:\/\//,'');$('#qr').src='https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(url);
  stats(j.stats);$('#list').innerHTML=j.donations.slice(0,8).map(row).join('');timer();setInterval(timer,1000);
  const es=new EventSource('/api/c/'+slug+'/stream');es.addEventListener('donation',e=>{const {donation,stats:s}=JSON.parse(e.data);stats(s);const l=$('#list');l.insertAdjacentHTML('afterbegin',row(donation));while(l.children.length>8)l.lastChild.remove();$('#pa').textContent=cur+fmt(donation.amount);$('#pn').textContent=donation.anonymous||!donation.name?'תורם אנונימי':donation.name;$('#pd').textContent=donation.dedication||'';$('#pop').classList.add('on');setTimeout(()=>$('#pop').classList.remove('on'),6000)});es.addEventListener('refresh',e=>stats(JSON.parse(e.data).stats))});
</script></body></html>
